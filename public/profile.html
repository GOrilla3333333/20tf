<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - 20Thousand Forums</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="https://i.imgur.com/oJCfWc8.png">
    <style>
        .profile-card {
            background: #1e2f4f;
            border: 1px solid #2b4570;
            border-radius: 4px;
            overflow: hidden;
        }
        .profile-banner {
            width: 100%;
            height: 180px;
            background: #0f1c2e;
            background-size: cover;
            background-position: center;
            border-bottom: 1px solid #2b4570;
        }
        .profile-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: -50px;
            padding: 0 20px;
        }
        .profile-header-left {
            display: flex;
            align-items: flex-end;
            gap: 16px;
            flex-wrap: wrap;
        }
        .profile-pfp-wrap {
            position: relative;
            display: inline-flex;
        }
        .profile-pfp {
            width: 108px;
            height: 108px;
            border-radius: 50%;
            border: 3px solid #1e2f4f;
            outline: 1px solid #355387;
            object-fit: cover;
            background: #0f1b2e;
        }
        .profile-pfp-wrap .online-dot {
            width: 16px;
            height: 16px;
            bottom: 5px;
            right: 5px;
            border-width: 2px;
        }
        .profile-info {
            padding: 16px 20px 20px;
        }
        .bio {
            margin-top: 8px;
            color: #ffffff;
            white-space: pre-wrap;
            background: #142238;
            border: 1px solid #2b4570;
            border-radius: 4px;
            padding: 12px 14px;
        }
        .profile-title-badge {
            display: inline-block;
            background: #0165fc;
            color: #ffffff;
            padding: 2px 9px;
            border-radius: 3px;
            font-size: 0.74em;
            font-weight: bold;
            margin-left: 8px;
            vertical-align: middle;
        }
        .online-pill {
            display: inline-block;
            font-size: 0.72em;
            padding: 2px 8px;
            border-radius: 3px;
            margin-left: 6px;
            vertical-align: middle;
            font-weight: bold;
        }
        .online-pill.on {
            background: #173826;
            color: #4be38a;
            border: 1px solid #2ecc71;
        }
        .online-pill.off {
            background: #142238;
            color: #c5d4eb;
            border: 1px solid #2b4570;
        }
        .profile-stats-inline {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
            margin-top: 12px;
            padding: 10px 14px;
            background: #142238;
            border: 1px solid #2b4570;
            border-radius: 4px;
            font-size: 0.9em;
            color: #c5d4eb;
        }
        .profile-stats-inline strong {
            color: #fffd01;
            margin-left: 4px;
        }
        .profile-signature {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #2b4570;
            color: #c5d4eb;
            font-size: 0.9em;
            white-space: pre-wrap;
        }
        .tabs {
            display: flex;
            gap: 6px;
            margin: 18px 0 0 0;
            border-bottom: 1px solid #2b4570;
        }
        .tab {
            background: #142238;
            border: 1px solid #2b4570;
            border-bottom: none;
            color: #c5d4eb;
            padding: 8px 18px;
            border-radius: 4px 4px 0 0;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }
        .tab:hover {
            background: #1e2f4f;
            color: #ffffff;
        }
        .tab.active {
            background: #0165fc;
            color: #ffffff;
            border-color: #0165fc;
        }
        .feed-block {
            background: #1e2f4f;
            border: 1px solid #2b4570;
            border-top: none;
            border-radius: 0 0 4px 4px;
            padding: 14px;
        }
        .item {
            background: #142238;
            border: 1px solid #2b4570;
            border-radius: 4px;
            padding: 12px 14px;
            margin: 8px 0;
        }
        .item a {
            color: #fffd01;
            text-decoration: none;
            font-weight: bold;
        }
        .item a:hover {
            text-decoration: underline;
        }
        .comment-user {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .comment-pfp {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #355387;
        }
        .edit-btn {
            background: #0165fc;
            color: #ffffff;
            border: 1px solid #0165fc;
            padding: 7px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
        }
        .edit-btn:hover {
            background: #fffd01;
            border-color: #fffd01;
            color: #162437;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        .modal-content {
            background: #1e2f4f;
            padding: 22px;
            border-radius: 4px;
            border: 1px solid #2b4570;
            width: 90%;
            max-width: 400px;
            color: #ffffff;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <img src="https://i.imgur.com/oJCfWc8.png" class="logo" alt="Logo" onclick="window.location.href='/'">
        <h1>20Thousand Forums</h1>
    </header>

    <nav>
        <a href="/">Home</a>
        <a href="/forums">Boards</a>
        <a href="/search.html">Search</a>
        <a href="/alerts.html">Alerts <span id="alert-badge" style="display:none; background:#ff4444; color:white; border-radius:4px; padding:1px 6px; font-size:12px; margin-left:4px;">0</span></a>
        <span id="user-nav"></span>
        <form action="/search.html" method="get" class="nav-search">
            <input name="q" placeholder="Search users or d1scs...">
            <button type="submit">Search</button>
        </form>
    </nav>

    <div id="global-banner" style="display:none; background:#fffd01; color:#162437; padding:12px; text-align:center; font-weight:bold;"></div>

    <div class="container" style="max-width:860px;">
        <div class="breadcrumbs">
            <a href="/">Home</a>
            <span class="bc-sep">›</span>
            <a href="/forums">Boards</a>
            <span class="bc-sep">›</span>
            <span class="bc-current" id="bcProfileName">Profile</span>
        </div>

        <div class="profile-card">
            <div class="profile-banner" id="banner"></div>

            <div class="profile-header">
                <div class="profile-header-left">
                    <div class="profile-pfp-wrap">
                        <img id="pfp" class="profile-pfp" src="https://i.imgur.com/oJCfWc8.png" alt="">
                        <span id="profileOnlineDot" class="online-dot" style="display:none;" title="Online now"></span>
                    </div>
                    <div>
                        <h2 style="margin:0; color:#fffd01;">
                            <span id="username">Loading...</span>
                            <span id="userTitleBadge" class="profile-title-badge" style="display:none;"></span>
                            <span id="onlineStatusPill" class="online-pill" style="display:none;"></span>
                        </h2>
                        <p id="joined" style="color:#c5d4eb; margin:4px 0 0 0; font-size:0.9em;"></p>
                    </div>
                </div>
                <div>
                    <button id="editBtn" class="edit-btn" style="display:none;" onclick="toggleEdit()">Edit Profile</button>
                </div>
            </div>

            <div class="profile-info">
                <div class="bio" id="bio">Loading...</div>
                <div class="profile-stats-inline" id="profileStatsBar"></div>
                <div class="profile-signature" id="profileSignature" style="display:none;"></div>

                <div id="banBanner" style="display:none; margin:16px 0; padding:12px 14px; background:#3a1010; border:1px solid #ff4444; border-radius:4px; color:#ffcccc; font-weight:bold; line-height:1.4;"></div>

                <div id="editForm" style="display:none; margin-top:16px; background:#0f1c2e; border:1px solid #2b4570; border-radius:4px; padding:16px;">
                    <h3 style="margin-top:0;color:#fffd01;">Edit Profile</h3>
                    <label style="font-weight:bold;">Bio:</label><br>
                    <textarea id="editBio" rows="3" style="width:100%; background:#142238; color:#ffffff; border:1px solid #355387; border-radius:4px; padding:8px; box-sizing:border-box; font-family:inherit; margin-top:4px;" placeholder="Your bio..."></textarea><br><br>

                    <label style="font-weight:bold;">Forum Signature (shown at the bottom of your posts):</label><br>
                    <textarea id="editSignature" rows="2" style="width:100%; background:#142238; color:#ffffff; border:1px solid #355387; border-radius:4px; padding:8px; box-sizing:border-box; font-family:inherit; margin-top:4px;" placeholder="Your forum signature..."></textarea><br><br>

                    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;">
                        <div>
                            <label for="editPfpFile" class="attach-btn">Change Avatar</label>
                            <input type="file" id="editPfpFile" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none;">
                            <div><small id="pfpStatus" style="color:#c5d4eb;"></small></div>
                        </div>
                        <div>
                            <label for="editBannerFile" class="attach-btn">Change Banner</label>
                            <input type="file" id="editBannerFile" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none;">
                            <div><small id="bannerStatus" style="color:#c5d4eb;"></small></div>
                        </div>
                    </div>

                    <button class="button" onclick="saveProfile()" style="background:#00cc66; color:#ffffff;">Save Changes</button>
                    <button class="button" onclick="toggleEdit()" style="background:#3a4b66; margin-left:8px;">Cancel</button>
                </div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showTab('activity')">Activity</button>
            <button class="tab" onclick="showTab('comments')">Profile Comments</button>
        </div>

        <div class="feed-block">
            <div id="activityTab">
                <div id="activityList">Loading activity...</div>
            </div>

            <div id="commentsTab" style="display:none;">
                <div id="commentBox" style="display:none; margin-bottom:14px; background:#0f1c2e; border:1px solid #2b4570; border-radius:4px; padding:12px;">
                    <textarea id="commentContent" rows="3" style="width:100%; background:#142238; color:#ffffff; border:1px solid #355387; border-radius:4px; padding:10px; box-sizing:border-box; font-family:inherit;" placeholder="Leave a comment on this profile..."></textarea><br>
                    <button onclick="postComment()" class="button" style="margin-top:8px;">Post comment</button>
                </div>
                <div id="commentsList">Loading comments...</div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const profileUser = urlParams.get('user');
        const currentUser = localStorage.getItem('username');

        let pendingPfpFile = null;
        let pendingBannerFile = null;
        let originalPfp = "";
        let originalBanner = "";
        let currentSignature = "";

        const ROLE_COLORS = {
            owner: '#d4a017',
            moderator: '#2ecc71',
            mod: '#2ecc71',
            janitor: '#1abc9c',
            trusted: '#9b59b6',
            member: '#0165fc'
        };

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        document.getElementById('user-nav').innerHTML = currentUser
            ? `<span class="nav-user-bar">Signed in as <a href="/profile.html?user=${encodeURIComponent(currentUser)}"><strong>${escapeHtml(currentUser)}</strong></a>${currentUser === '20k' ? ' · <a href="/admin.html">Admin</a>' : ''} · <a href="#" onclick="showLogoutModal();return false;">Logout</a></span>`
            : '<a href="/login">Login</a> <a href="/register">Register</a>';

        function showLogoutModal() {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.style.display = 'flex';
            modal.innerHTML = `<div class="modal-content"><h3>Logout?</h3><p>Are you sure you want to logout?</p><button class="button" style="background:#ff4444;" onclick="localStorage.removeItem('username');location.href='/'">Yes, Logout</button><button class="button" style="background:#3a4b66;" onclick="this.parentElement.parentElement.remove()">Cancel</button></div>`;
            document.body.appendChild(modal);
        }

        async function loadProfile() {
            if (!profileUser) {
                document.getElementById('username').textContent = "User not found";
                return;
            }

            const res = await fetch(`/api/profile/${encodeURIComponent(profileUser)}`);
            const data = await res.json();

            if (!data.success) {
                document.getElementById('username').textContent = "User not found";
                return;
            }

            document.getElementById('username').textContent = data.username;
            document.getElementById('bcProfileName').textContent = data.username;
            const badgeEl = document.getElementById('userTitleBadge');
            if (badgeEl) {
                const roleTitle = data.title || 'Member';
                badgeEl.textContent = roleTitle;
                badgeEl.style.background = ROLE_COLORS[roleTitle.toLowerCase()] || '#0165fc';
                badgeEl.style.display = 'inline-block';
            }

            const dotEl = document.getElementById('profileOnlineDot');
            const pillEl = document.getElementById('onlineStatusPill');
            if (data.online) {
                dotEl.style.display = 'block';
                pillEl.textContent = 'Online';
                pillEl.className = 'online-pill on';
                pillEl.style.display = 'inline-block';
            } else {
                dotEl.style.display = 'none';
                pillEl.textContent = 'Offline';
                pillEl.className = 'online-pill off';
                pillEl.style.display = 'inline-block';
            }

            document.getElementById('pfp').src = data.pfp;
            document.getElementById('bio').textContent = data.bio;
            const joinedDate = data.created_at ? new Date(data.created_at).toLocaleDateString() : "N/A";
            document.getElementById('joined').textContent = data.created_at
                ? `Member since ${joinedDate}`
                : "";
            document.getElementById('profileStatsBar').innerHTML =
                `<span>Posts: <strong>${data.postCount || 0}</strong></span>` +
                `<span>Reaction score: <strong>${data.reactionScore || 0}</strong></span>` +
                `<span>Joined: <strong>${escapeHtml(joinedDate)}</strong></span>`;

            currentSignature = data.signature || "";
            const sigEl = document.getElementById('profileSignature');
            if (currentSignature) {
                sigEl.textContent = "Signature: " + currentSignature;
                sigEl.style.display = 'block';
            } else {
                sigEl.style.display = 'none';
            }

            const banEl = document.getElementById('banBanner');
            if (data.banned) {
                const reason = data.banReason || 'No reason given';
                const type = data.banType ? ' (' + data.banType + ')' : '';
                banEl.innerHTML =
                    'THIS USER IS A RULEBREAKER' + escapeHtml(type) + '<br>' +
                    'REASON FOR BAN: <span style="color:#fffd01;">' +
                    escapeHtml(reason) +
                    '</span>';
                banEl.style.display = 'block';
            } else {
                banEl.style.display = 'none';
            }

            originalPfp = data.pfp || "";
            originalBanner = data.banner || "";

            if (data.banner) {
                document.getElementById('banner').style.backgroundImage = `url(${data.banner})`;
            } else {
                document.getElementById('banner').style.backgroundImage = "";
            }

            if (currentUser === profileUser) {
                document.getElementById('editBtn').style.display = 'inline-block';
            }

            if (currentUser) {
                document.getElementById('commentBox').style.display = 'block';
            }

            loadActivity();
            loadComments();
        }

        function showTab(name) {
            document.getElementById('activityTab').style.display = name === 'activity' ? 'block' : 'none';
            document.getElementById('commentsTab').style.display = name === 'comments' ? 'block' : 'none';

            document.querySelectorAll('.tab').forEach((t, i) => {
                t.classList.toggle(
                    'active',
                    (name === 'activity' && i === 0) ||
                    (name === 'comments' && i === 1)
                );
            });
        }

        function toggleEdit() {
            const form = document.getElementById('editForm');
            const isHidden = form.style.display === 'none';

            form.style.display = isHidden ? 'block' : 'none';

            if (isHidden) {
                document.getElementById('editBio').value =
                    document.getElementById('bio').textContent;
                document.getElementById('editSignature').value = currentSignature || '';

                document.getElementById('editPfpFile').value = '';
                document.getElementById('editBannerFile').value = '';
                document.getElementById('pfpStatus').textContent = '';
                document.getElementById('bannerStatus').textContent = '';

                pendingPfpFile = null;
                pendingBannerFile = null;
            } else {
                document.getElementById('pfp').src =
                    originalPfp || "https://i.imgur.com/oJCfWc8.png";

                document.getElementById('banner').style.backgroundImage =
                    originalBanner ? `url(${originalBanner})` : "";

                pendingPfpFile = null;
                pendingBannerFile = null;
            }
        }

        function resizeImage(file, maxW, maxH, square) {
            return new Promise((resolve, reject) => {
                if (file.type === 'image/gif') {
                    resolve(file);
                    return;
                }

                const img = new Image();
                const url = URL.createObjectURL(file);

                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    if (square) {
                        const size = Math.min(img.width, img.height);
                        const sx = (img.width - size) / 2;
                        const sy = (img.height - size) / 2;

                        canvas.width = maxW;
                        canvas.height = maxW;

                        ctx.drawImage(img, sx, sy, size, size, 0, 0, maxW, maxW);
                    } else {
                        let w = img.width;
                        let h = img.height;
                        const ratio = Math.min(maxW / w, maxH / h, 1);

                        canvas.width = Math.max(1, Math.round(w * ratio));
                        canvas.height = Math.max(1, Math.round(h * ratio));

                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    }

                    canvas.toBlob((blob) => {
                        URL.revokeObjectURL(url);
                        if (!blob) return reject(new Error("Resize failed"));
                        resolve(
                            new File(
                                [blob],
                                file.name.replace(/\.[^.]+$/, '.jpg'),
                                { type: 'image/jpeg' }
                            )
                        );
                    }, 'image/jpeg', 0.85);
                };

                img.onerror = () => reject(new Error("Could not read image"));
                img.src = url;
            });
        }

        async function uploadFile(file, statusEl) {
            statusEl.textContent = "Uploading...";
            const fd = new FormData();
            fd.append('file', file);
            const r = await fetch('/api/upload', { method: 'POST', body: fd });
            const d = await r.json();
            if (d.success) {
                statusEl.textContent = "Uploaded";
                return d.url;
            }
            statusEl.textContent = d.message || "Upload failed";
            return null;
        }

        document.getElementById('editPfpFile').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('pfpStatus').textContent = "Resizing...";
            try {
                pendingPfpFile = await resizeImage(file, 256, 256, true);
                document.getElementById('pfp').src = URL.createObjectURL(pendingPfpFile);
                document.getElementById('pfpStatus').textContent = "Ready (will save on Save)";
            } catch (err) {
                document.getElementById('pfpStatus').textContent = "Could not process image";
            }
        });

        document.getElementById('editBannerFile').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('bannerStatus').textContent = "Resizing...";
            try {
                pendingBannerFile = await resizeImage(file, 1500, 400, false);
                document.getElementById('banner').style.backgroundImage = `url(${URL.createObjectURL(pendingBannerFile)})`;
                document.getElementById('bannerStatus').textContent = "Ready (will save on Save)";
            } catch (err) {
                document.getElementById('bannerStatus').textContent = "Could not process image";
            }
        });

        async function saveProfile() {
            const bio = document.getElementById('editBio').value.trim();
            const signature = document.getElementById('editSignature').value.trim();
            const body = { username: currentUser, bio, signature };

            if (pendingPfpFile) {
                const url = await uploadFile(pendingPfpFile, document.getElementById('pfpStatus'));
                if (!url) return alert("PFP upload failed - check the terminal");
                body.pfp = url;
            }

            if (pendingBannerFile) {
                const url = await uploadFile(pendingBannerFile, document.getElementById('bannerStatus'));
                if (!url) return alert("Banner upload failed - check the terminal");
                body.banner = url;
            }

            const res = await fetch('/api/profile/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            const data = await res.json();
            if (!data.success) {
                alert(data.message || "Failed to update");
                return;
            }

            const check = await fetch(`/api/profile/${encodeURIComponent(currentUser)}`);
            const saved = await check.json();

            document.getElementById('bio').textContent = saved.bio || bio;
            currentSignature = saved.signature !== undefined ? saved.signature : signature;
            const sigEl = document.getElementById('profileSignature');
            if (currentSignature) {
                sigEl.textContent = "Signature: " + currentSignature;
                sigEl.style.display = 'block';
            } else {
                sigEl.style.display = 'none';
            }
            document.getElementById('pfp').src = saved.pfp || originalPfp;

            originalPfp = saved.pfp || originalPfp;
            originalBanner = saved.banner || originalBanner;

            document.getElementById('banner').style.backgroundImage =
                saved.banner ? `url(${saved.banner})` : "";

            pendingPfpFile = null;
            pendingBannerFile = null;
            document.getElementById('editForm').style.display = 'none';
        }

        async function loadActivity() {
            const res = await fetch(`/api/profile/${encodeURIComponent(profileUser)}/activity`);
            const items = await res.json();
            const list = document.getElementById('activityList');

            if (!items.length) {
                list.innerHTML = "<p style='color:#c5d4eb;margin:0;'>No activity yet.</p>";
                return;
            }

            list.innerHTML = items.map(a => {
                if (a.type === 'thread') {
                    return `
                    <div class="item">
                        <div style="font-size:0.85em;color:#c5d4eb;">Started a d1sc</div>
                        <a href="${escapeHtml(a.url)}">${escapeHtml(a.title)}</a>
                        <div style="color:#c5d4eb; font-size:0.84em; margin-top:4px;">
                            ${new Date(a.created_at).toLocaleString()}
                        </div>
                    </div>`;
                }

                return `
                <div class="item">
                    <div style="font-size:0.85em;color:#c5d4eb;">Replied in</div>
                    <a href="${escapeHtml(a.url)}">${escapeHtml(a.title)}</a>
                    <div style="color:#ffffff; margin-top:6px;">
                        ${escapeHtml(a.preview || '')}
                    </div>
                    <div style="color:#c5d4eb; font-size:0.84em; margin-top:4px;">
                        ${new Date(a.created_at).toLocaleString()}
                    </div>
                </div>`;
            }).join('');
        }

        async function loadComments() {
            const res = await fetch(`/api/profile/${encodeURIComponent(profileUser)}/comments`);
            const comments = await res.json();
            const list = document.getElementById('commentsList');

            if (!comments.length) {
                list.innerHTML = "<p style='color:#c5d4eb;margin:0;'>No profile comments yet.</p>";
                return;
            }

            list.innerHTML = comments.map(c => {
                const canDelete =
                    currentUser === "20k" ||
                    currentUser === c.user_id ||
                    currentUser === profileUser;

                return `
                <div class="item">
                    <div class="comment-user">
                        <img class="comment-pfp" src="${escapeHtml(c.pfp)}" alt="">
                        <a href="/profile.html?user=${encodeURIComponent(c.user_id)}" style="color:#fffd01; text-decoration:none;">
                            <strong>${escapeHtml(c.user_id)}</strong>
                        </a>
                        <small style="color:#c5d4eb;">
                            ${new Date(c.created_at).toLocaleString()}
                        </small>

                        ${canDelete ? `
                            <button
                                onclick="deleteComment('${escapeHtml(c.id)}')"
                                style="margin-left:auto; background:#3a1818; border:1px solid #6b2a2a; color:#ff9999; border-radius:3px; padding:2px 8px; font-size:12px; font-family:inherit; cursor:pointer;">
                                Delete
                            </button>
                        ` : ''}
                    </div>

                    <div>
                        ${escapeHtml(c.content || '').replace(/\n/g, '<br>')}
                    </div>
                </div>`;
            }).join('');
        }

        async function postComment() {
            const content = document.getElementById('commentContent').value.trim();
            if (!content) return alert("Add some words");

            const res = await fetch(`/api/profile/${encodeURIComponent(profileUser)}/comments`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser, content })
            });

            const data = await res.json();
            if (data.success) {
                document.getElementById('commentContent').value = '';
                loadComments();
            } else {
                alert(data.message || "Failed");
            }
        }

        async function deleteComment(id) {
            if (!confirm("Delete this comment?")) return;

            await fetch(`/api/profile/comments/${encodeURIComponent(id)}`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser })
            });

            loadComments();
        }

        async function loadGlobalBanner() {
            try {
                const res = await fetch('/api/global-banner');
                const data = await res.json();
                const el = document.getElementById('global-banner');
                if (!el) return;
                if (data && data.active && (data.text || data.imageUrl)) {
                    let content = escapeHtml(data.text || "");
                    if (data.imageUrl) {
                        content += `<br><img src="${escapeHtml(data.imageUrl)}" style="max-width:100%; margin-top:8px;">`;
                    }
                    el.innerHTML = content;
                    el.style.display = 'block';
                } else {
                    el.style.display = 'none';
                }
            } catch (e) {}
        }

        async function checkBan() {
            const u = localStorage.getItem('username');
            if (!u) return;
            try {
                const res = await fetch(`/api/check-ban/${encodeURIComponent(u)}`);
                const data = await res.json();
                if (data.banned) {
                    localStorage.clear();
                    window.location.href = `/banned.html?reason=${encodeURIComponent(data.reason || 'No reason')}&type=${data.type || 'permanent'}`;
                }
            } catch (e) {}
        }

        async function loadAlertBadge() {
            if (!currentUser) return;
            try {
                const res = await fetch(`/api/alerts/${encodeURIComponent(currentUser)}`);
                if (!res.ok) return;
                const data = await res.json();
                const badge = document.getElementById('alert-badge');
                if (!badge) return;
                if (data.unread > 0) {
                    badge.style.display = 'inline';
                    badge.textContent = data.unread > 99 ? '99+' : data.unread;
                } else badge.style.display = 'none';
            } catch (e) {}
        }

        loadProfile();
        loadGlobalBanner();
        checkBan();
        loadAlertBadge();
        setInterval(checkBan, 8000);
        setInterval(loadAlertBadge, 15000);
    </script>
</body>
</html>

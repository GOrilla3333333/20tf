<div id="global-banner" style="display:none; background:#fffd01; color:#162437; padding:12px; text-align:center; font-weight:bold;"></div>

<div class="container" style="max-width:750px; margin:30px auto;">

    <div class="profile-info">
        <div class="bio" id="bio">Loading...</div>

        <!-- Ban banner -->
        <div id="banBanner" style="display:none; margin:16px 0; padding:14px 16px; background:#3a1010; border:2px solid #ff4444; border-radius:8px; color:#ffcccc; font-weight:bold; line-height:1.4;"></div>

        <button id="editBtn" class="edit-btn" style="display:none;" onclick="toggleEdit()">Edit Profile</button>

        <div id="editForm" style="display:none; margin-top:20px;">
            <textarea id="editBio" rows="4" style="width:100%;" placeholder="Your bio..."></textarea><br><br>

            <label>Profile Picture (png / jpg / webp / gif):</label><br>

            <small id="pfpStatus" style="color:#aaa;"></small><br><br>

            <label>Banner (png / jpg / webp / gif):</label><br>
            <input type="file" id="editBannerFile" accept="image/png,image/jpeg,image/webp,image/gif"><br>
            <small id="bannerStatus" style="color:#aaa;"></small><br><br>

            <button onclick="saveProfile()" style="background:#00cc66; color:white; padding:10px 20px;">Save</button>

        <div id="activityList">Loading activity...</div>

        <div id="commentBox" style="display:none; margin-bottom:15px;">

            <button onclick="postComment()" style="margin-top:8px; background:#0165fc; color:white; padding:8px 16px; border:none; border-radius:6px; cursor:pointer;">Post comment</button>

</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const profileUser = urlParams.get('user');
    const currentUser = localStorage.getItem('username');

    let pendingPfpFile = null;
    let pendingBannerFile = null;
    let originalPfp = "";
    let originalBanner = "";

    document.getElementById('user-nav').innerHTML = currentUser
        ? `<a href="/profile.html?user=${encodeURIComponent(currentUser)}" style="color:inherit; text-decoration:none;">Logged in as: <strong>${currentUser}</strong></a>`
        : '<a href="/login">Login</a>';

    async function loadProfile() {
        if (!profileUser) {
            document.getElementById('username').textContent = "User not found";
            return;
        }

        const res = await fetch(`/api/profile/${profileUser}`);
        const data = await res.json();

        if (!data.success) {
            document.getElementById('username').textContent = "User not found";
            return;
        }

        document.getElementById('username').textContent = data.username;
        document.getElementById('pfp').src = data.pfp;
        document.getElementById('bio').textContent = data.bio;
        document.getElementById('joined').textContent = data.created_at
            ? `Joined ${new Date(data.created_at).toLocaleDateString()}`
            : "";

        // Show ban information for banned profiles
        const banEl = document.getElementById('banBanner');

        if (data.banned) {
            const reason = data.banReason || 'No reason given';
            const type = data.banType ? ' (' + data.banType + ')' : '';

            banEl.innerHTML =
                'THIS USER IS A RULEBREAKER' + type + '<br>' +
                'REASON FOR BAN: <span style="color:#fffd01;">' +
                escapeHtml(reason) +
                '</span>';

            banEl.style.display = 'block';
        } else {
            banEl.style.display = 'none';
        }

        originalPfp = data.pfp || "";
        originalBanner = data.banner || "";

        if (data.banner) {
            document.getElementById('banner').style.backgroundImage = `url(${data.banner})`;
        } else {
            document.getElementById('banner').style.backgroundImage = "";
        }

        if (currentUser === profileUser) {
            document.getElementById('editBtn').style.display = 'inline-block';
        }

        if (currentUser) {
            document.getElementById('commentBox').style.display = 'block';
        }

        loadActivity();
        loadComments();
    }

    function showTab(name) {
        document.getElementById('activityTab').style.display = name === 'activity' ? 'block' : 'none';
        document.getElementById('commentsTab').style.display = name === 'comments' ? 'block' : 'none';

        document.querySelectorAll('.tab').forEach((t, i) => {
            t.classList.toggle(
                'active',
                (name === 'activity' && i === 0) ||
                (name === 'comments' && i === 1)
            );
        });
    }

    function toggleEdit() {
        const form = document.getElementById('editForm');
        const isHidden = form.style.display === 'none';

        form.style.display = isHidden ? 'block' : 'none';

        if (isHidden) {
            document.getElementById('editBio').value =
                document.getElementById('bio').textContent;

            document.getElementById('editPfpFile').value = '';
            document.getElementById('editBannerFile').value = '';
            document.getElementById('pfpStatus').textContent = '';
            document.getElementById('bannerStatus').textContent = '';

            pendingPfpFile = null;
            pendingBannerFile = null;
        } else {
            document.getElementById('pfp').src =
                originalPfp || "https://i.imgur.com/oJCfWc8.png";

            document.getElementById('banner').style.backgroundImage =
                originalBanner ? `url(${originalBanner})` : "";

            pendingPfpFile = null;
            pendingBannerFile = null;
        }
    }

    function resizeImage(file, maxW, maxH, square) {
        return new Promise((resolve, reject) => {
            if (file.type === 'image/gif') {
                resolve(file);
                return;
            }

            const img = new Image();
            const url = URL.createObjectURL(file);

            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                if (square) {
                    const size = Math.min(img.width, img.height);
                    const sx = (img.width - size) / 2;
                    const sy = (img.height - size) / 2;

                    canvas.width = maxW;
                    canvas.height = maxW;

                    ctx.drawImage(
                        img,
                        sx,
                        sy,
                        size,
                        size,
                        0,
                        0,
                        maxW,
                        maxW
                    );
                } else {
                    let w = img.width;
                    let h = img.height;
                    const ratio = Math.min(maxW / w, maxH / h, 1);

                    canvas.width = Math.max(1, Math.round(w * ratio));
                    canvas.height = Math.max(1, Math.round(h * ratio));

                    ctx.drawImage(
                        img,
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );
                }

                canvas.toBlob((blob) => {
                    URL.revokeObjectURL(url);

                    if (!blob) {
                        return reject(new Error("Resize failed"));
                    }

                    resolve(
                        new File(
                            [blob],
                            file.name.replace(/\.[^.]+$/, '.jpg'),
                            { type: 'image/jpeg' }
                        )
                    );
                }, 'image/jpeg', 0.85);
            };

            img.onerror = () => reject(new Error("Could not read image"));
            img.src = url;
        });
    }

    async function uploadFile(file, statusEl) {
        statusEl.textContent = "Uploading...";

        const fd = new FormData();
        fd.append('file', file);

        const r = await fetch('/api/upload', {
            method: 'POST',
            body: fd
        });

        const d = await r.json();

        if (d.success) {
            statusEl.textContent = "Uploaded";
            return d.url;
        }

        statusEl.textContent = d.message || "Upload failed";
        return null;
    }

    document.getElementById('editPfpFile').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('pfpStatus').textContent = "Resizing...";

        try {
            pendingPfpFile = await resizeImage(file, 256, 256, true);

            document.getElementById('pfp').src =
                URL.createObjectURL(pendingPfpFile);

            document.getElementById('pfpStatus').textContent =
                "Ready (will save on Save)";
        } catch (err) {
            document.getElementById('pfpStatus').textContent =
                "Could not process image";
        }
    });

    document.getElementById('editBannerFile').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('bannerStatus').textContent = "Resizing...";

        try {
            pendingBannerFile = await resizeImage(file, 1500, 400, false);

            document.getElementById('banner').style.backgroundImage =
                `url(${URL.createObjectURL(pendingBannerFile)})`;

            document.getElementById('bannerStatus').textContent =
                "Ready (will save on Save)";
        } catch (err) {
            document.getElementById('bannerStatus').textContent =
                "Could not process image";
        }
    });

    async function saveProfile() {
        const bio = document.getElementById('editBio').value.trim();
        const body = {
            username: currentUser,
            bio
        };

        if (pendingPfpFile) {
            const url = await uploadFile(
                pendingPfpFile,
                document.getElementById('pfpStatus')
            );

            if (!url) return alert("PFP upload failed — check the terminal");

            body.pfp = url;
        }

        if (pendingBannerFile) {
            const url = await uploadFile(
                pendingBannerFile,
                document.getElementById('bannerStatus')
            );

            if (!url) return alert("Banner upload failed — check the terminal");

            body.banner = url;
        }

        console.log("SENDING PROFILE UPDATE:", body);

        const res = await fetch('/api/profile/update', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
        });

        const data = await res.json();

        console.log("PROFILE UPDATE RESPONSE:", data);

        if (!data.success) {
            alert(data.message || "Failed to update");
            return;
        }

        const check = await fetch(`/api/profile/${currentUser}`);
        const saved = await check.json();

        console.log("PROFILE AFTER RELOAD:", saved);

        document.getElementById('bio').textContent = saved.bio || bio;
        document.getElementById('pfp').src = saved.pfp || originalPfp;

        originalPfp = saved.pfp || originalPfp;
        originalBanner = saved.banner || originalBanner;

        document.getElementById('banner').style.backgroundImage =
            saved.banner ? `url(${saved.banner})` : "";

        pendingPfpFile = null;
        pendingBannerFile = null;

        document.getElementById('editForm').style.display = 'none';
    }

    async function loadActivity() {
        const res = await fetch(`/api/profile/${profileUser}/activity`);
        const items = await res.json();
        const list = document.getElementById('activityList');

        if (!items.length) {
            list.innerHTML = "<p>No activity yet.</p>";
            return;
        }

        list.innerHTML = items.map(a => {
            if (a.type === 'thread') {
                return `
                <div class="item">
                    <div>Started a d1sc</div>
                    <a href="${a.url}">${a.title}</a>
                    <div style="color:#aaa; font-size:0.9em; margin-top:4px;">
                        ${new Date(a.created_at).toLocaleString()}
                    </div>
                </div>`;
            }

            return `
            <div class="item">
                <div>Replied in</div>
                <a href="${a.url}">${a.title}</a>
                <div style="color:#ccc; margin-top:6px;">
                    ${(a.preview || '').replace(/</g, '&lt;')}
                </div>
                <div style="color:#aaa; font-size:0.9em; margin-top:4px;">
                    ${new Date(a.created_at).toLocaleString()}
                </div>
            </div>`;
        }).join('');
    }

    async function loadComments() {
        const res = await fetch(`/api/profile/${profileUser}/comments`);
        const comments = await res.json();
        const list = document.getElementById('commentsList');

        if (!comments.length) {
            list.innerHTML = "<p>No profile comments yet.</p>";
            return;
        }

        list.innerHTML = comments.map(c => {
            const canDelete =
                currentUser === "20k" ||
                currentUser === c.user_id ||
                currentUser === profileUser;

            return `
            <div class="item">
                <div class="comment-user">
                    <img class="comment-pfp" src="${c.pfp}">
                    <a href="/profile.html?user=${c.user_id}" style="color:inherit; text-decoration:none;">
                        <strong>${c.user_id}</strong>
                    </a>
                    <small style="color:#aaa;">
                        ${new Date(c.created_at).toLocaleString()}
                    </small>

                    ${canDelete ? `
                        <button
                            onclick="deleteComment('${c.id}')"
                            style="margin-left:auto; background:none; border:none; color:#ff6666; cursor:pointer;">
                            🗑
                        </button>
                    ` : ''}
                </div>

                <div>
                    ${(c.content || '').replace(/</g, '&lt;').replace(/\n/g, '<br>')}
                </div>
            </div>`;
        }).join('');
    }

    async function postComment() {
        const content =
            document.getElementById('commentContent').value.trim();

        if (!content) return alert("Add some words");

        const res = await fetch(`/api/profile/${profileUser}/comments`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                username: currentUser,
                content
            })
        });

        const data = await res.json();

        if (data.success) {
            document.getElementById('commentContent').value = '';
            loadComments();
        } else {
            alert(data.message || "Failed");
        }
    }

    async function deleteComment(id) {
        if (!confirm("Delete this comment?")) return;

        await fetch(`/api/profile/comments/${id}`, {
            method: 'DELETE',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                username: currentUser
            })
        });

        loadComments();
    }

    // Escape HTML for the ban reason
    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    loadProfile();

    async function loadGlobalBanner() {
        try {
            const res = await fetch('/api/global-banner');
            const data = await res.json();
            const el = document.getElementById('global-banner');

            if (!el) return;

            if (data && data.active && (data.text || data.imageUrl)) {
                let content = data.text || "";

                if (data.imageUrl) {
                    content += `
                        <br>
                        <img src="${data.imageUrl}" style="max-width:100%; margin-top:8px;">
                    `;
                }

                el.innerHTML = content;
                el.style.display = 'block';
            } else {
                el.style.display = 'none';
            }
        } catch (e) {}
    }

    async function checkBan() {
        const currentUser = localStorage.getItem('username');
        if (!currentUser) return;

        try {
            const res = await fetch(
                `/api/check-ban/${encodeURIComponent(currentUser)}`
            );

            const data = await res.json();

            if (data.banned) {
                localStorage.clear();

                window.location.href =
                    `/banned.html?reason=${encodeURIComponent(data.reason || 'No reason')}&type=${data.type || 'permanent'}`;
            }
        } catch (e) {}
    }

    loadGlobalBanner();
    checkBan();
    setInterval(checkBan, 8000);
</script>

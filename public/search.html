<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - 20Thousand Forums</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="https://i.imgur.com/oJCfWc8.png">
    <style>
        .search-box {
            display: flex;
            gap: 8px;
            margin: 20px 0;
            max-width: 700px;
        }
        .search-box input {
            flex: 1;
            padding: 12px 14px;
            border-radius: 8px;
            border: 2px solid #0165fc;
            background: #0f1b2e;
            color: white;
            font-size: 1em;
        }
        .search-box button {
            padding: 12px 20px;
            background: #0165fc;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .hints {
            color: #aaa;
            font-size: 0.9em;
            margin-bottom: 20px;
        }
        .hints code {
            background: #1e2f4f;
            padding: 2px 6px;
            border-radius: 4px;
            color: #fffd01;
        }
        .section-title {
            color: #fffd01;
            border-bottom: 2px solid #0165fc;
            padding-bottom: 4px;
            margin: 24px 0 12px 0;
        }
        .result {
            background: #1e2f4f;
            border: 2px solid #0165fc;
            border-radius: 8px;
            padding: 14px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .result:hover { border-color: #fffd01; }
        .result img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #0165fc;
        }
        .result a {
            color: #fffd01;
            text-decoration: none;
            font-weight: bold;
        }
        .result a:hover { text-decoration: underline; }
        .meta { color: #aaa; font-size: 0.9em; }
    </style>
</head>
<body>
    <header>
        <img src="https://i.imgur.com/oJCfWc8.png" class="logo">
        <h1>20Thousand Forums</h1>
    </header>

    <nav>
        <a href="/">Home</a> |
        <a href="/forums">Boards</a> |
        <a href="/search.html">Search</a> |
        <span id="user-nav"></span>
    </nav>

    <div class="container" style="max-width:800px; margin:30px auto;">
        <h2>Search</h2>

        <div class="search-box">
            <input id="q" type="text" placeholder='Try user:20k or d1sc:hello' autofocus>
            <button onclick="runSearch()">Search</button>
        </div>

        <div class="hints">
            Commands:<br>
            <code>user:name</code> — exact or partial username<br>
            <code>d1sc:title</code> — exact or partial d1sc title<br>
            Plain text searches both.
        </div>

        <div id="results">Type a query and press Search.</div>
    </div>

    <script>
        const username = localStorage.getItem('username');
        document.getElementById('user-nav').innerHTML = username
            ? `Logged in as: <a href="/profile.html?user=${encodeURIComponent(username)}" style="color:inherit;text-decoration:none;"><strong>${username}</strong></a>`
            : '<a href="/login">Login</a>';

        document.getElementById('q').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') runSearch();
        });

        // prefill from ?q=
        const params = new URLSearchParams(window.location.search);
        if (params.get('q')) {
            document.getElementById('q').value = params.get('q');
            runSearch();
        }

        async function runSearch() {
            const q = document.getElementById('q').value.trim();
            const box = document.getElementById('results');
            if (!q) {
                box.innerHTML = "Type a query and press Search.";
                return;
            }

            box.innerHTML = "Searching...";
            history.replaceState(null, "", `/search.html?q=${encodeURIComponent(q)}`);

            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
                const data = await res.json();
                let html = "";

                if (data.users && data.users.length) {
                    html += `<div class="section-title">Users (${data.users.length})</div>`;
                    html += data.users.map(u => `
                        <div class="result">
                            <img src="${u.pfp}" alt="">
                            <div>
                                <a href="/profile.html?user=${encodeURIComponent(u.username)}">${u.username}</a>
                                <div class="meta">${u.title} · ${u.postCount} posts</div>
                            </div>
                        </div>
                    `).join("");
                }

                if (data.threads && data.threads.length) {
                    html += `<div class="section-title">d1scs (${data.threads.length})</div>`;
                    html += data.threads.map(t => `
                        <div class="result">
                            <div>
                                <a href="/thread.html?id=${t.id}&title=${encodeURIComponent(t.title)}">${t.pinned ? "📌 " : ""}${t.title}</a>
                                <div class="meta">/${t.forum_id}/ · ${t.user_id} · ${t.created_at ? new Date(t.created_at).toLocaleDateString() : ""}</div>
                            </div>
                        </div>
                    `).join("");
                }

                if (!html) html = "<p>No results.</p>";
                box.innerHTML = html;
            } catch (e) {
                box.innerHTML = "<p>Search failed.</p>";
            }
        }
    </script>
</body>
</html>

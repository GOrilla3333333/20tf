<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - 20Thousand Forums</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="https://i.imgur.com/oJCfWc8.png">
    <style>
        .search-form-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .search-form-row input {
            flex: 1;
        }
        .hints {
            color: #8c98b3;
            font-size: 12px;
        }
        .hints code {
            background: #141926;
            border: 1px solid #2d364d;
            padding: 1px 5px;
            border-radius: 2px;
            color: #dce2ec;
        }
        .result-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-bottom: 1px solid #293247;
            background: #202738;
        }
        .result-row:last-child {
            border-bottom: none;
        }
        .result-row:hover {
            background: #242c3f;
        }
        .result-title {
            color: #eceff4;
            font-weight: 600;
            font-size: 13.5px;
            text-decoration: none;
        }
        .result-title:hover {
            color: #55a6f8;
            text-decoration: underline;
        }
        .result-meta {
            color: #8c98b3;
            font-size: 12px;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <img src="https://i.imgur.com/oJCfWc8.png" class="logo" alt="Logo" onclick="window.location.href='/'">
            <h1 onclick="window.location.href='/'">20Thousand Forums</h1>
        </div>
    </header>

    <nav>
        <a href="/">Home</a>
        <a href="/forums">Boards</a>
        <a href="/members.html">Members</a>
        <a href="/watched.html">Watched</a>
        <a href="/bookmarks.html">Bookmarks</a>
        <a href="/search.html" class="active">Search</a>
        <a href="/inbox.html">Inbox <span id="inbox-badge" class="nav-badge" style="display:none;">0</span></a>
        <a href="/alerts.html">Alerts <span id="alert-badge" class="nav-badge" style="display:none;">0</span></a>
        <span id="user-nav"></span>
        <form action="/search.html" method="get" class="nav-search">
            <input name="q" placeholder="Search...">
            <button type="submit">Search</button>
        </form>
    </nav>

    <div class="container" style="max-width:920px;">
        <div class="breadcrumbs">
            <a href="/">Home</a>
            <span class="bc-sep">›</span>
            <span class="bc-current">Search</span>
        </div>

        <div class="xf-block">
            <div class="xf-block-header">Search Forums</div>
            <div class="xf-block-body">
                <div class="search-form-row">
                    <input id="q" type="text" placeholder="Keywords, user:name, or d1sc:title..." autofocus>
                    <button class="button" onclick="runSearch()">Search</button>
                </div>
                <div class="hints">
                    Prefixes: <code>user:name</code> for members · <code>d1sc:title</code> for thread titles · Plain text searches both.
                </div>
            </div>
        </div>

        <div id="results"></div>
    </div>

    <footer class="site-footer">
        <div class="site-footer-inner">
            <span>20Thousand Forums</span>
            <div>
                <a href="/">Home</a>
                <a href="/forums">Boards</a>
                <a href="/tos">Terms &amp; Rules</a>
            </div>
        </div>
    </footer>

    <script>
        const username = localStorage.getItem('username');

        function escapeHtml(s) {
            return String(s || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        document.getElementById('user-nav').innerHTML = username
            ? `<span class="nav-user-bar">Signed in as <a href="/profile.html?user=${encodeURIComponent(username)}"><strong>${escapeHtml(username)}</strong></a></span>`
            : '<a href="/login">Login</a> <a href="/register">Register</a>';

        document.getElementById('q').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') runSearch();
        });

        const params = new URLSearchParams(window.location.search);
        if (params.get('q')) {
            document.getElementById('q').value = params.get('q');
            runSearch();
        }

        async function runSearch() {
            const q = document.getElementById('q').value.trim();
            const box = document.getElementById('results');
            if (!q) {
                box.innerHTML = "";
                return;
            }

            box.innerHTML = `<div class="xf-block"><div class="xf-block-body" style="color:#8c98b3;">Searching...</div></div>`;
            history.replaceState(null, "", `/search.html?q=${encodeURIComponent(q)}`);

            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
                const data = await res.json();
                let html = "";

                if (data.users && data.users.length) {
                    html += `<div class="xf-block"><div class="xf-block-header">Members (${data.users.length})</div>`;
                    html += data.users.map(u => `
                        <div class="result-row">
                            <img class="avatar-sq" src="${escapeHtml(u.pfp)}" alt="">
                            <div>
                                <a class="result-title" href="/profile.html?user=${encodeURIComponent(u.username)}">${escapeHtml(u.username)}</a>
                                <div class="result-meta">${escapeHtml(u.title)} · ${u.postCount || 0} messages</div>
                            </div>
                        </div>
                    `).join("");
                    html += `</div>`;
                }

                if (data.threads && data.threads.length) {
                    html += `<div class="xf-block"><div class="xf-block-header">Threads (${data.threads.length})</div>`;
                    html += data.threads.map(t => `
                        <div class="result-row">
                            <div>
                                <a class="result-title" href="/thread.html?id=${encodeURIComponent(t.id)}&title=${encodeURIComponent(t.title || '')}">${escapeHtml(t.title)}</a>
                                ${t.pinned ? '<span class="status-tag">Pinned</span>' : ''}
                                <div class="result-meta">s1k/${escapeHtml(t.forum_id)}/ · Started by ${escapeHtml(t.user_id)} · ${t.created_at ? new Date(t.created_at).toLocaleDateString() : ""}</div>
                            </div>
                        </div>
                    `).join("");
                    html += `</div>`;
                }

                if (!html) {
                    html = `<div class="xf-block"><div class="xf-block-body" style="color:#8c98b3;">No results found.</div></div>`;
                }
                box.innerHTML = html;
            } catch (e) {
                box.innerHTML = `<div class="xf-block"><div class="xf-block-body" style="color:#8c98b3;">Search failed.</div></div>`;
            }
        }
    </script>
</body>
</html>

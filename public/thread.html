<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>20Thousand Forums</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="https://i.imgur.com/oJCfWc8.png">

    <style>
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 25px;
            border-radius: 6px;
            z-index: 20000;
            color: white;
            font-weight: bold;
        }

        .original-post {
            background: #fff3d9;
            color: #000;
            border-left: 5px solid #fffd01;
        }

        .reply-post {
            background: #1e2f4f;
            color: white;
            border-left: 5px solid #0165fc;
        }

        .post {
            padding: 15px;
            margin: 12px 0;
            border-radius: 8px;
            position: relative;
        }

        .post.highlight-post {
            outline: 2px solid #fffd01;
        }

        .user-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .user-pfp {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #0165fc;
        }

        .username-link {
            color: inherit;
            text-decoration: none;
            font-weight: bold;
        }

        .username-link:hover {
            text-decoration: underline;
            color: #fffd01;
        }

        .reply-btn {
            margin-top: 8px;
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 12px;
        }

        .menu-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #aaa;
            line-height: 1;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 36px;
            right: 8px;
            background: #0f1b2e;
            border: 2px solid #0165fc;
            border-radius: 8px;
            min-width: 140px;
            z-index: 50;
            overflow: hidden;
        }

        .dropdown-menu button {
            display: block;
            width: 100%;
            background: none;
            border: none;
            color: white;
            text-align: left;
            padding: 10px 14px;
            cursor: pointer;
            font-family: inherit;
        }

        .dropdown-menu button:hover {
            background: #1e2f4f;
        }

        .thread-header {
            position: relative;
            margin-bottom: 10px;
        }

        .thread-header .menu-btn {
            position: absolute;
            top: 0;
            right: 0;
        }

        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .modal-content {
            background: #1e2f4f;
            padding: 25px;
            border-radius: 12px;
            border: 3px solid #0165fc;
            width: 90%;
            max-width: 450px;
            color: white;
        }

        img, video {
            max-width: 100%;
            border-radius: 8px;
            margin: 10px 0 15px 0;
            display: block;
        }

        a { color: #0165fc; text-decoration: underline; }
    </style>
</head>
<body>
    <header>
        <img src="https://i.imgur.com/oJCfWc8.png" class="logo">
        <h1>20Thousand Forums</h1>
    </header>

    <nav>
        <a href="/forums">← Back to Boards</a> |
        <span id="user-nav"></span>
    </nav>
    <hr>

    <div class="thread-header">
        <h2 id="thread-title">Loading...</h2>
        <p><small>Created by <strong id="thread-creator">...</strong></small></p>
        <button class="menu-btn" onclick="showThreadDropdown(event)">⋮</button>
        <div id="thread-dropdown" class="dropdown-menu">
            <button onclick="openReportModal('thread')">Report thread</button>
            <button id="delete-thread-btn" onclick="openDeleteThreadModal()" style="display:none; color:#ff6666;">Delete thread</button>
        </div>
    </div>

    <div id="postsList">Loading posts...</div>

    <!-- REPLY BOX -->
    <div style="position:sticky; bottom:0; background:#0f1b2e; padding:12px; border-top:2px solid #0165fc;">
        <div class="reply-target">
            Replying to: <span id="replyTarget">OP</span>
            <span onclick="cancelReply()" style="color:#ff4444; cursor:pointer; margin-left:10px;">Cancel</span>
        </div>

        <form id="replyForm">
            <textarea id="postContent" placeholder="Write your reply..." rows="4"></textarea><br><br>
            <input type="file" id="mediaFile" accept="image/*,video/*" multiple><br><br>
            <button type="submit">Post Reply</button>
        </form>
    </div>

    <!-- EDIT MODAL -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3>Edit Post</h3>
            <textarea id="editContent" rows="8" style="width:100%;"></textarea><br><br>
            <button onclick="saveEdit()">Save</button>
            <button onclick="closeEditModal()">Cancel</button>
        </div>
    </div>

    <!-- REPORT MODAL -->
    <div id="reportModal" class="modal">
        <div class="modal-content">
            <h3>Report</h3>
            <textarea id="reportReason" rows="4" style="width:100%;" placeholder="Why are you reporting this?"></textarea><br><br>
            <button onclick="submitReport()">Submit Report</button>
            <button onclick="closeReportModal()">Cancel</button>
        </div>
    </div>

    <!-- DELETE POST MODAL -->
    <div id="deletePostModal" class="modal">
        <div class="modal-content">
            <h3>Delete this reply?</h3>
            <p>This cannot be undone.</p>
            <button onclick="confirmDeletePost()" style="background:#ff4444; color:white;">Delete</button>
            <button onclick="closeDeletePostModal()">Cancel</button>
        </div>
    </div>

    <!-- DELETE THREAD MODAL -->
    <div id="deleteThreadModal" class="modal">
        <div class="modal-content">
            <h3>Delete this thread?</h3>
            <p>All replies will be deleted too.</p>
            <button onclick="confirmDeleteThread()" style="background:#ff4444; color:white;">Delete thread</button>
            <button onclick="closeDeleteThreadModal()">Cancel</button>
        </div>
    </div>

    <script>
        const threadId = new URLSearchParams(window.location.search).get('id');
        const username = localStorage.getItem('username');

        let currentReplyParent = null;
        let currentEditId = null;
        let currentDeleteId = null;
        let currentReportId = null;
        let rootPostId = null;
        let threadCreator = null;
        const postContentMap = {};

        document.getElementById('user-nav').innerHTML = username
            ? `Logged in as: <a href="/profile.html?user=${encodeURIComponent(username)}" style="color:inherit; text-decoration:none;"><strong>${username}</strong></a>`
            : '<a href="/login">Login</a>';

        async function loadThreadInfo() {
            try {
                const res = await fetch(`/api/threads/${threadId}`);
                const data = await res.json();
                document.getElementById('thread-title').textContent = data.title || "Thread not found";
                document.getElementById('thread-creator').textContent = data.creator || "Unknown";
                threadCreator = data.creator;

                if (username === "20k" || username === threadCreator) {
                    document.getElementById('delete-thread-btn').style.display = 'block';
                }
            } catch(e) {}
        }

        function makeMedia(text) {
            if (!text) return "";
            return text.replace(/(https:\/\/res\.cloudinary\.com\/[^\s<]+)/gi, (url) => {
                if (url.match(/\.(mp4|mov|webm|avi|mkv)$/i)) {
                    return `<video controls><source src="${url}" type="video/mp4"></video>`;
                }
                return `<img src="${url}" alt="Media">`;
            });
        }

        function storePosts(posts) {
            posts.forEach(post => {
                postContentMap[post.id] = post.content || "";
                if (post.replies && post.replies.length) storePosts(post.replies);
            });
        }

        function render(posts, depth = 0) {
            let html = '';

            posts.forEach(post => {
                const allFiles = post.fileUrls || (post.fileUrl ? [post.fileUrl] : []);
                let mediaHTML = allFiles.map(url => {
                    if (!url) return '';
                    if (url.match(/\.(mp4|mov|webm|avi|mkv)$/i)) {
                        return `<video controls><source src="${url}" type="video/mp4"></video>`;
                    }
                    return `<img src="${url}" alt="Media">`;
                }).join('');

                let text = (post.content || '').replace(/\n/g, '<br>');
                const isOriginal = post.id === rootPostId;
                const pfp = post.pfp || "https://i.imgur.com/oJCfWc8.png";
                const canEdit = post.user_id === username || username === "20k";
                const canDelete = canEdit && !isOriginal;

                html += `
                <div class="post ${isOriginal ? 'original-post' : 'reply-post'}" id="post-${post.id}" style="margin-left:${depth*20}px">
                    <button class="menu-btn" onclick="showDropdown('${post.id}', event)">⋮</button>
                    <div id="dropdown-${post.id}" class="dropdown-menu">
                        ${canEdit ? `<button onclick="editPost('${post.id}')">Edit</button>` : ''}
                        ${canDelete ? `<button onclick="openDeletePostModal('${post.id}')" style="color:#ff6666;">Delete</button>` : ''}
                        <button onclick="openReportModal('${post.id}')">Report</button>
                    </div>

                    <div class="user-row">
                        <img src="${pfp}" class="user-pfp" alt="pfp">
                        <a href="/profile.html?user=${post.user_id}" class="username-link">${post.user_id}</a>
                        <small>${new Date(post.created_at).toLocaleString()}</small>
                    </div>

                    <div>${makeMedia(text)}</div>
                    ${mediaHTML}

                    ${!isOriginal ? `<button class="reply-btn" onclick="setReply('${post.id}','${post.user_id}')">Reply</button>` : ''}

                    ${post.replies && post.replies.length ? render(post.replies, depth + 1) : ''}
                </div>`;
            });
            return html;
        }

        function jumpToHash() {
            const hash = window.location.hash;
            if (!hash) return;
            const el = document.querySelector(hash);
            if (!el) return;
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            el.classList.add('highlight-post');
            setTimeout(() => el.classList.remove('highlight-post'), 2500);
        }

        async function loadPosts() {
            try {
                const res = await fetch(`/api/threads/${threadId}/posts`);
                const posts = await res.json();

                if (posts.length > 0) rootPostId = posts[0].id;
                storePosts(posts);

                document.getElementById('postsList').innerHTML =
                    posts.length ? render(posts) : "<p>No posts yet.</p>";

                jumpToHash();
            } catch(e) {
                console.error(e);
            }
        }

        function hideAllDropdowns() {
            document.querySelectorAll('.dropdown-menu').forEach(m => m.style.display = 'none');
        }

        function showDropdown(postId, e) {
            e.stopPropagation();
            hideAllDropdowns();
            document.getElementById(`dropdown-${postId}`).style.display = 'block';
        }

        function showThreadDropdown(e) {
            e.stopPropagation();
            hideAllDropdowns();
            document.getElementById('thread-dropdown').style.display = 'block';
        }

        document.addEventListener('click', hideAllDropdowns);

        function setReply(id, user) {
            currentReplyParent = id;
            document.getElementById('replyTarget').textContent = user;
        }

        function cancelReply() {
            currentReplyParent = null;
            document.getElementById('replyTarget').textContent = "OP";
        }

        document.getElementById('replyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const content = document.getElementById('postContent').value.trim();
            const files = document.getElementById('mediaFile').files;

            if (!content && files.length === 0) {
                showNotification("Add some words to post the reply!", "#ff4444");
                return;
            }

            let fileUrls = [];
            for (let file of files) {
                const fd = new FormData();
                fd.append('file', file);
                const r = await fetch('/api/upload', {method: 'POST', body: fd});
                const d = await r.json();
                if (d.success) fileUrls.push(d.url);
            }

            await fetch('/api/posts', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    content: content,
                    thread_id: threadId,
                    username: username,
                    fileUrls: fileUrls,
                    parent_id: currentReplyParent
                })
            });

            document.getElementById('postContent').value = '';
            document.getElementById('mediaFile').value = '';
            cancelReply();
            loadPosts();
        });

        function showNotification(text, color) {
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.style.background = color;
            notif.textContent = text;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 3000);
        }

        function editPost(id) {
            hideAllDropdowns();
            currentEditId = id;
            document.getElementById('editContent').value = postContentMap[id] || '';
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        async function saveEdit() {
            await fetch(`/api/posts/${currentEditId}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username,
                    content: document.getElementById('editContent').value
                })
            });
            closeEditModal();
            loadPosts();
        }

        function openDeletePostModal(id) {
            hideAllDropdowns();
            currentDeleteId = id;
            document.getElementById('deletePostModal').style.display = 'flex';
        }

        function closeDeletePostModal() {
            document.getElementById('deletePostModal').style.display = 'none';
        }

        async function confirmDeletePost() {
            await fetch(`/api/posts/${currentDeleteId}`, {
                method: 'DELETE',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username })
            });
            closeDeletePostModal();
            loadPosts();
        }

        function openDeleteThreadModal() {
            hideAllDropdowns();
            document.getElementById('deleteThreadModal').style.display = 'flex';
        }

        function closeDeleteThreadModal() {
            document.getElementById('deleteThreadModal').style.display = 'none';
        }

        async function confirmDeleteThread() {
            const res = await fetch(`/api/threads/${threadId}`, {
                method: 'DELETE',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username })
            });
            const data = await res.json();
            if (data.success) {
                window.location.href = '/forums';
            } else {
                showNotification(data.message || "Could not delete thread", "#ff4444");
                closeDeleteThreadModal();
            }
        }

        function openReportModal(id) {
            hideAllDropdowns();
            currentReportId = id === 'thread' ? threadId : id;
            document.getElementById('reportReason').value = '';
            document.getElementById('reportModal').style.display = 'flex';
        }

        function closeReportModal() {
            document.getElementById('reportModal').style.display = 'none';
        }

        async function submitReport() {
            const reason = document.getElementById('reportReason').value.trim();
            if (!reason) return showNotification("Enter a reason", "#ff4444");

            await fetch('/api/report', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    post_id: currentReportId,
                    reported_by: username,
                    reason
                })
            });

            closeReportModal();
            showNotification("Report submitted", "#00cc66");
        }

        async function checkBan() {
            const currentUser = localStorage.getItem('username');
            if (!currentUser) return;
            try {
                const res = await fetch(`/api/check-ban/${currentUser}`);
                const data = await res.json();
                if (data.banned) {
                    localStorage.clear();
                    window.location.href = `/banned.html?reason=${encodeURIComponent(data.reason || 'No reason')}&type=${data.type || 'permanent'}`;
                }
            } catch (e) {}
        }

        loadThreadInfo();
        loadPosts();
        checkBan();
        setInterval(checkBan, 8000);
    </script>
</body>
</html>

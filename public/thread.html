<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>20Thousand Forums</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .notification { 
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%); 
            padding: 15px 25px; border-radius: 6px; z-index: 20000; 
            color: white; font-weight: bold; 
        }
        .post { 
            background: #1e2f4f; padding: 15px; margin: 12px 0; 
            border-radius: 8px; border-left: 5px solid #0165fc; 
            position: relative; 
        }
        .original-post { 
            background: #fff3d9 !important; color: #000000 !important; 
        }
        .menu-btn, .edit-btn, .delete-btn, .reply-btn { 
            position: absolute; top: 10px; right: 10px; background: none; 
            border: none; font-size: 22px; cursor: pointer; color: #aaa; 
        }
        .edit-btn { right: 45px; }
        .delete-btn { right: 80px; color: #ff6666; }
        .reply-btn { right: 115px; }
        img, video { max-width: 100%; border-radius: 8px; margin-top: 8px; }
    </style>
</head>
<body>
    <header>
        <img src="https://i.imgur.com/oJCfWc8.png" alt="Logo" class="logo">
        <h1>20Thousand Forums</h1>
    </header>

    <nav><a href="/forums">← Back to Boards</a></nav>
    <hr>

    <h2 id="thread-title"></h2>
    <p><small>Created by <strong id="thread-creator">Unknown</strong></small></p>

    <div id="postsList"></div>

    <hr>
    <h3 id="reply-header">Reply</h3>
    <form id="replyForm">
        <textarea id="postContent" placeholder="Write your reply..." rows="4"></textarea><br><br>
        <input type="file" id="mediaFile" accept="image/*,video/*"><br><br>
        <button type="submit" class="button">Post Reply</button>
    </form>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const threadId = urlParams.get('id');
        const username = localStorage.getItem('username');

        document.getElementById('thread-title').textContent = urlParams.get('title') || "Thread";

        let replyingTo = null;

        function showNotification(text, color = "#00cc66") {
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.style.background = color;
            notif.textContent = text;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 2500);
        }

        function formatText(text) {
            if (!text) return "";
            return text
                .replace(/\n/g, "<br>")
                .replace(/\*\*\*(.*?)\*\*\*/g, "<b><i style='color:#000000;'>$1</i></b>")
                .replace(/\*\*(.*?)\*\*/g, "<b style='color:#000000;'>$1</b>")
                .replace(/\*(.*?)\*/g, "<i style='color:#000000;'>$1</i>");
        }

        function renderMedia(url) {
            if (!url) return '';
            return url.match(/\.(mp4|webm|mov)$/i) 
                ? `<video controls src="${url}"></video>` 
                : `<img src="${url}" style="max-width:100%; border-radius:8px;">`;
        }

        async function loadPosts() {
            try {
                const res = await fetch(`/api/threads/${threadId}/posts`);
                const posts = await res.json();
                console.log("📥 Loaded posts:", posts);

                const original = posts.find(p => !p.parent_id);
                const replies = posts.filter(p => p.parent_id);

                let html = '';

                // Original Post
                if (original) {
                    const canManage = (username === original.user_id || username === "20k");
                    html += `
                        <div class="post original-post">
                            ${canManage ? `<button class="edit-btn" onclick="editPost('${original.id}')">✏️</button>` : ''}
                            ${canManage ? `<button class="delete-btn" onclick="deletePost('${original.id}')">🗑️</button>` : ''}
                            <button class="reply-btn" onclick="startReply('${original.id}')">↩️</button>
                            <strong>${original.user_id}</strong> 
                            <small>${new Date(original.created_at).toLocaleString()}</small>
                            <p>${formatText(original.content)}</p>
                            ${renderMedia(original.fileUrl)}
                        </div>`;
                }

                // Nested Replies
                function renderReplies(parentId, level = 0) {
                    let str = '';
                    const children = replies
                        .filter(r => r.parent_id === parentId)
                        .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

                    children.forEach(reply => {
                        const canManage = (username === reply.user_id || username === "20k");
                        str += `
                            <div class="post" style="margin-left: ${level * 45}px; border-left: 3px solid #555;">
                                ${canManage ? `<button class="edit-btn" onclick="editPost('${reply.id}')">✏️</button>` : ''}
                                ${canManage ? `<button class="delete-btn" onclick="deletePost('${reply.id}')">🗑️</button>` : ''}
                                <button class="reply-btn" onclick="startReply('${reply.id}')">↩️</button>
                                <strong>${reply.user_id}</strong> 
                                <small>${new Date(reply.created_at).toLocaleString()}</small>
                                <p>${formatText(reply.content)}</p>
                                ${renderMedia(reply.fileUrl)}
                                ${renderReplies(reply.id, level + 1)}
                            </div>`;
                    });
                    return str;
                }

                html += renderReplies(original ? original.id : null);
                document.getElementById('postsList').innerHTML = html || '<p>No posts yet.</p>';

                if (original) document.getElementById('thread-creator').textContent = original.user_id;
            } catch(e) {
                console.error(e);
            }
        }

        // Submit Reply
        document.getElementById('replyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const content = document.getElementById('postContent').value.trim();

            if (!username) return showNotification("Please login first", "#ff4444");
            if (!content) return showNotification("Write something", "#ff4444");

            const res = await fetch('/api/posts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    content, 
                    thread_id: threadId, 
                    username, 
                    parent_id: replyingTo 
                })
            });

            const data = await res.json();
            showNotification(data.message, data.success ? "#00cc66" : "#ff4444");

            if (data.success) {
                document.getElementById('postContent').value = '';
                replyingTo = null;
                document.getElementById('reply-header').textContent = "Reply";
                await loadPosts();   // This should now show the new reply
            }
        });

        function startReply(parentId) {
            replyingTo = parentId;
            document.getElementById('reply-header').textContent = "Replying to a post...";
        }

        // Load on start
        loadPosts();
    </script>
</body>
</html>

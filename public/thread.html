<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>20Thousand Forums</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="https://i.imgur.com/oJCfWc8.png">

    <style>
        .original-post { background: #fff3d9; color: #000; border-left: 5px solid #fffd01; }
        .reply-post { background: #1e2f4f; color: white; border-left: 5px solid #0165fc; }
        .post { padding: 15px; margin: 12px 0; border-radius: 8px; position: relative; }
        
        /* Better media sizing */
        img, video {
            max-width: 100%;
            max-height: 500px;        /* Prevents super tall images */
            width: auto;
            height: auto;
            border-radius: 8px;
            margin: 10px 0 15px 0;
            display: block;
            object-fit: contain;      /* Keeps aspect ratio */
        }
        
        a { color: #0165fc; text-decoration: underline; }
    </style>
</head>
<body>
    <header>
        <img src="https://i.imgur.com/oJCfWc8.png" class="logo">
        <h1>20Thousand Forums</h1>
    </header>

    <nav><a href="/forums">← Back to Boards</a></nav>
    <hr>

    <h2 id="thread-title">Loading...</h2>
    <p><small>Created by <strong id="thread-creator">...</strong></small></p>

    <div id="postsList">Loading posts...</div>

    <div style="position:sticky; bottom:0; background:#0f1b2e; padding:12px; border-top:2px solid #0165fc;">
        <form id="replyForm">
            <textarea id="postContent" placeholder="Write your reply..." rows="4"></textarea><br><br>
            <input type="file" id="mediaFile" accept="image/*,video/*" multiple><br><br>
            <button type="submit">Post Reply</button>
        </form>
    </div>

    <script>
        const threadId = new URLSearchParams(window.location.search).get('id');

        async function loadThreadInfo() {
            try {
                const res = await fetch(`/api/threads/${threadId}`);
                const data = await res.json();
                document.getElementById('thread-title').textContent = data.title || "Thread not found";
                document.getElementById('thread-creator').textContent = data.creator || "Unknown";
            } catch(e) {}
        }

        function render(posts) {
            let html = '';
            posts.forEach(post => {
                const allFiles = post.fileUrls || (post.fileUrl ? [post.fileUrl] : []);
                let mediaHTML = '';
                allFiles.forEach(url => {
                    if (url) {
                        if (url.match(/\.(mp4|mov|webm|avi|mkv)$/i)) {
                            mediaHTML += `<video controls><source src="${url}" type="video/mp4"></video>`;
                        } else {
                            mediaHTML += `<img src="${url}" alt="Media">`;
                        }
                    }
                });

                let text = (post.content || '').replace(/\n/g, '<br>');
                text = text.replace(/https:\/\/res\.cloudinary\.com[^\s<]+/gi, ''); // hide raw urls

                html += `
                <div class="post ${post.parent_id ? 'reply-post' : 'original-post'}">
                    <strong>${post.user_id}</strong> 
                    <small>${new Date(post.created_at).toLocaleString()}</small>
                    <div>${text}</div>
                    ${mediaHTML}
                </div>`;
            });
            return html;
        }

        async function loadPosts() {
            try {
                const res = await fetch(`/api/threads/${threadId}/posts`);
                const posts = await res.json();
                document.getElementById('postsList').innerHTML = posts.length ? render(posts) : "<p>No posts yet.</p>";
            } catch(e) {
                console.error(e);
            }
        }

        document.getElementById('replyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const content = document.getElementById('postContent').value.trim();
            const files = document.getElementById('mediaFile').files;

            let fileUrls = [];
            for (let file of files) {
                const fd = new FormData();
                fd.append('file', file);
                const r = await fetch('/api/upload', {method: 'POST', body: fd});
                const d = await r.json();
                if (d.success) fileUrls.push(d.url);
            }

            await fetch('/api/posts', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    content: content,
                    thread_id: threadId,
                    username: localStorage.getItem('username'),
                    fileUrls: fileUrls
                })
            });

            document.getElementById('postContent').value = '';
            document.getElementById('mediaFile').value = '';
            loadPosts();
        });

        loadThreadInfo();
        loadPosts();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reports - 20Thousand Forums</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .notification {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            padding: 15px 25px; border-radius: 6px; z-index: 20000;
            color: white; font-weight: bold;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #444; }
        th { background: #0165fc; color: white; }
        button { margin-right: 5px; padding: 6px 12px; }
    </style>
</head>
<body>
    <header>
        <img src="https://i.imgur.com/oJCfWc8.png" alt="Logo" class="logo">
        <h1>20Thousand Forums - Reports</h1>
    </header>

    <nav>
        <a href="/forums">← Back to Forums</a> | 
        <a href="/admin.html">Admin Panel</a>
    </nav>

    <div class="container">
        <h2>All Reports</h2>
        <button onclick="loadReports()">🔄 Refresh Reports</button>
        
        <table id="reportsTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Reported By</th>
                    <th>Target ID</th>
                    <th>Reason</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        async function loadReports() {
            try {
                const res = await fetch('/api/reports?username=20k');
                const reports = await res.json();

                const tbody = document.querySelector('#reportsTable tbody');
                tbody.innerHTML = '';

                if (reports.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:30px;">No reports yet.</td></tr>`;
                    return;
                }

                reports.forEach(r => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${new Date(r.created_at).toLocaleString()}</td>
                        <td><strong>${r.reported_by}</strong></td>
                        <td>${r.post_id}</td>
                        <td>${r.reason}</td>
                        <td>${r.status || 'pending'}</td>
                        <td>
                            <button onclick="deleteThread('${r.post_id}')">Delete Thread</button>
                            <button onclick="clearReport('${r.id}')" style="background:#ffaa00;">Clear Report</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                console.error(err);
                showNotification("Failed to load reports", "#ff4444");
            }
        }

        async function deleteThread(threadId) {
            if (!confirm("Delete this thread and all replies permanently?")) return;

            const res = await fetch(`/api/threads/${threadId}`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: "20k" })
            });

            const data = await res.json();
            showNotification(data.message, data.success ? "#00cc66" : "#ff4444");
            if (data.success) loadReports();
        }

        async function clearReport(reportId) {
            if (!confirm("Mark this report as cleared/resolved?")) return;

            const res = await fetch(`/api/reports/${reportId}/review`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: "20k" })
            });

            const data = await res.json();
            showNotification(data.message, data.success ? "#00cc66" : "#ff4444");
            loadReports();
        }

        function showNotification(text, color) {
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.style.background = color;
            notif.textContent = text;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 2800);
        }

        // Load reports on page open
        loadReports();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Test</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <h1>Admin Test (20k only)</h1>
    <button onclick="setBanner()">Set Test Banner</button>

    <script>
        async function setBanner() {
            const res = await fetch('/api/admin/banner', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: "20k",
                    text: "This is a global announcement from 20k!",
                    imageUrl: ""
                })
            });
            const data = await res.json();
            alert(data.message);
            window.location.href = '/';
        }
    </script>
</body>
</html>

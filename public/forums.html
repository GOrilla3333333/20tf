<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forums - 20Thousand Forums</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="https://i.imgur.com/oJCfWc8.png">
    <style>
        .category-block {
            margin-bottom: 16px;
            background: #202738;
            border: 1px solid #2d364d;
            border-radius: 3px;
            overflow: hidden;
        }
        .category-header {
            background: #252d40;
            border-bottom: 1px solid #2f384f;
            color: #dce2ec;
            padding: 9px 14px;
            font-weight: 500;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }
        .category-header:hover {
            background: #293247;
        }
        .category-chevron {
            color: #8c98b3;
            font-size: 12px;
            transition: none;
        }
        .category-block.collapsed .node-list {
            display: none;
        }
        .category-block.collapsed .category-header {
            border-bottom: none;
        }
        .node-row {
            display: grid;
            grid-template-columns: 44px minmax(0, 1fr) 115px 250px;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: #202738;
            border-bottom: 1px solid #293247;
        }
        .node-row:last-child {
            border-bottom: none;
        }
        .node-row:hover {
            background: #242c3f;
        }
        .node-icon {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d97706;
        }
        .node-main {
            min-width: 0;
        }
        .node-title-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }
        .node-title-link {
            margin: 0;
            color: #eceff4;
            font-size: 14.5px;
            font-weight: 700;
            text-decoration: none;
        }
        .node-title-link:hover {
            color: #55a6f8;
            text-decoration: underline;
        }
        .node-code {
            color: #77839e;
            font-size: 11.5px;
        }
        .node-desc {
            margin: 2px 0 0 0;
            color: #c77d3b;
            font-size: 12px;
            line-height: 1.35;
        }
        .node-stats {
            display: flex;
            justify-content: flex-end;
            gap: 14px;
            text-align: right;
            padding-right: 8px;
        }
        .node-stat-col .num {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: #dce2ec;
        }
        .node-stat-col .lbl {
            font-size: 11px;
            color: #8c98b3;
        }
        .node-last {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        .node-last-info {
            min-width: 0;
            flex: 1;
            font-size: 12px;
            color: #8c98b3;
        }
        .node-last-title {
            display: block;
            color: #eceff4;
            font-weight: 500;
            font-size: 12.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-decoration: none;
        }
        .node-last-title:hover {
            color: #55a6f8;
            text-decoration: underline;
        }
        .node-last-meta {
            margin-top: 2px;
            font-size: 11.5px;
            color: #8c98b3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .node-last-meta a {
            color: #8c98b3;
        }
        .node-last-meta a:hover {
            color: #55a6f8;
        }
        @media (max-width: 780px) {
            .node-row {
                grid-template-columns: 38px minmax(0, 1fr);
            }
            .node-stats, .node-last {
                grid-column: 2;
                justify-content: flex-start;
                text-align: left;
            }
        }
        .recent-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #293247;
        }
        .recent-item:first-child { padding-top: 2px; }
        .recent-item:last-child { border-bottom: none; padding-bottom: 2px; }
        .recent-info {
            min-width: 0;
            flex: 1;
            line-height: 1.35;
        }
        .recent-title {
            color: #eceff4;
            font-weight: 600;
            font-size: 12.5px;
            text-decoration: none;
            word-break: break-word;
        }
        .recent-title:hover {
            color: #55a6f8;
            text-decoration: underline;
        }
        .recent-meta {
            color: #8c98b3;
            font-size: 11.5px;
            margin-top: 2px;
        }
        .recent-meta a {
            color: #8c98b3;
        }
        .online-user-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .online-user-chip {
            font-size: 12.5px;
            font-weight: 600;
            text-decoration: none;
        }
        .online-user-chip:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <img src="https://i.imgur.com/oJCfWc8.png" class="logo" alt="Logo" onclick="window.location.href='/'">
            <h1 onclick="window.location.href='/'">20Thousand Forums</h1>
        </div>
    </header>

    <nav>
        <a href="/">Home</a>
        <a href="/forums" class="active">Boards</a>
        <a href="/members.html">Members</a>
        <a href="/watched.html">Watched</a>
        <a href="/bookmarks.html">Bookmarks</a>
        <a href="/search.html">Search</a>
        <a href="/inbox.html">Inbox <span id="inbox-badge" class="nav-badge" style="display:none;">0</span></a>
        <a href="/alerts.html">Alerts <span id="alert-badge" class="nav-badge" style="display:none;">0</span></a>
        <span id="user-nav"></span>
        <form action="/search.html" method="get" class="nav-search">
            <input name="q" placeholder="Search...">
            <button type="submit">Search</button>
        </form>
    </nav>

    <div id="global-banner" style="display:none; background:#252d40; border-bottom:1px solid #2d364d; color:#eceff4; padding:10px 16px; text-align:center; font-weight:600;"></div>

    <div class="container">
        <div class="breadcrumbs">
            <a href="/">Home</a>
            <span class="bc-sep">›</span>
            <span class="bc-current">Boards</span>
        </div>

        <div class="forum-layout">
            <div id="boardsContainer"></div>

            <aside>
                <div class="sidebar-widget">
                    <div class="sidebar-widget-header">
                        <svg class="svg-icon" viewBox="0 0 16 16"><path d="M11.251.068a.5.5 0 0 1 .227.58L9.677 6.5H13a.5.5 0 0 1 .364.843l-8 8.5a.5.5 0 0 1-.842-.49L6.323 9.5H3a.5.5 0 0 1-.364-.843l8-8.5a.5.5 0 0 1 .615-.09z"/></svg>
                        <span>New Threads</span>
                    </div>
                    <div class="sidebar-widget-body" id="recentPostsBox">
                        <div style="color:#8c98b3;">Loading...</div>
                    </div>
                </div>

                <div class="sidebar-widget">
                    <div class="sidebar-widget-header">
                        <svg class="svg-icon" viewBox="0 0 16 16"><path d="M7 14s-1 0-1-1 1-4 5-4 5 3 5 4-1 1-1 1H7zm4-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M5.216 14A2.238 2.238 0 0 1 5 13c0-1.355.68-2.75 1.936-3.72A6.325 6.325 0 0 0 5 9c-4 0-5 3-5 4s1 1 1 1h4.216zM4.5 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/></svg>
                        <span>Members Online</span>
                    </div>
                    <div class="sidebar-widget-body">
                        <div id="onlineUsersList" class="online-user-list">
                            <span style="color:#8c98b3;">No registered users active right now.</span>
                        </div>
                        <div style="margin-top:8px;padding-top:6px;border-top:1px solid #293247;color:#8c98b3;font-size:11.5px;">
                            Total: <strong id="onlineCountNum" style="color:#dce2ec;">0</strong>
                        </div>
                    </div>
                </div>

                <div class="sidebar-widget">
                    <div class="sidebar-widget-header">
                        <svg class="svg-icon" viewBox="0 0 16 16"><path d="M0 0h1v15h15v1H0V0zm10 3.5a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-1 0V4.9l-3.613 4.417a.5.5 0 0 1-.74.037L7.06 6.767l-3.656 5.027a.5.5 0 0 1-.808-.588l4-5.5a.5.5 0 0 1 .758-.06l2.609 2.61L13.445 4H10.5a.5.5 0 0 1-.5-.5z"/></svg>
                        <span>Forum Statistics</span>
                    </div>
                    <div class="sidebar-widget-body">
                        <dl class="pairs-justified"><dt>Threads:</dt><dd id="statThreads">0</dd></dl>
                        <dl class="pairs-justified"><dt>Messages:</dt><dd id="statPosts">0</dd></dl>
                        <dl class="pairs-justified"><dt>Members:</dt><dd id="statMembers">0</dd></dl>
                        <dl class="pairs-justified"><dt>Latest member:</dt><dd id="statNewest">-</dd></dl>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <footer class="site-footer">
        <div class="site-footer-inner">
            <span>20Thousand Forums</span>
            <div>
                <a href="/">Home</a>
                <a href="/forums">Boards</a>
                <a href="/tos">Terms &amp; Rules</a>
            </div>
        </div>
    </footer>

    <script>
        const username = localStorage.getItem('username');

        const SVG_CHAT = '<svg class="svg-icon-lg" viewBox="0 0 16 16"><path d="M2 1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h9.586a2 2 0 0 1 1.414.586l2 2V2a1 1 0 0 0-1-1H2zm12-1a2 2 0 0 1 2 2v12.793a.5.5 0 0 1-.854.353l-2.853-2.853a1 1 0 0 0-.707-.293H2a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h12z"/></svg>';
        const SVG_BULLHORN = '<svg class="svg-icon-lg" viewBox="0 0 16 16"><path d="M13 2.5a1.5 1.5 0 0 1 3 0v11a1.5 1.5 0 0 1-3 0v-.214c-2.162-1.241-4.49-1.843-6.912-2.083l.405 2.712A1 1 0 0 1 5.51 15.1h-.548a1 1 0 0 1-.916-.599l-1.85-3.49-.202-.003A2.014 2.014 0 0 1 0 9V7a2.02 2.02 0 0 1 1.992-2.013 74.663 74.663 0 0 0 2.483-.075c3.043-.154 6.148-.849 8.525-2.199V2.5z"/></svg>';
        const SVG_DOC = '<svg class="svg-icon-lg" viewBox="0 0 16 16"><path d="M4 0h5.293A1 1 0 0 1 10 .293L13.707 4a1 1 0 0 1 .293.707V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2zm5.5 1.5v2a1 1 0 0 0 1 1h2l-3-3z"/></svg>';

        const BOARD_NAMES = {
            "news": "News & Announcements",
            "rules": "Rules & Site Info",
            "b": "General / Random",
            "serious": "Serious Discussion",
            "vent": "Venting / Off My Chest",
            "int": "International",
            "brainrot": "Brainrot / Memes",
            "art": "Art & OCs",
            "media": "Music, Vidya & Media",
            "tech": "Tech & Coding",
            "nsfw": "18+ / NSFW",
            "stories": "Greentexts & Stories",
            "qna": "Questions & Advice"
        };

        const CATEGORIES = [
            {
                name: "Site Information",
                boards: [
                    { id: "news", code: "/announcements/", title: "News & Announcements", desc: "All you need to know about the forum and our community.", icon: SVG_BULLHORN },
                    { id: "rules", code: "/rules/", title: "Rules & Site Info", desc: "Read the rules before posting. Feedback, bug reports & site suggestions.", icon: SVG_DOC }
                ]
            },
            {
                name: "General Discussion",
                boards: [
                    { id: "b", code: "/b/", title: "General / Random", desc: "Anything goes (within site rules). Casual chat, random thoughts, daily threads.", icon: SVG_CHAT },
                    { id: "serious", code: "/serious/", title: "Serious Discussion", desc: "Debates, hot takes, philosophy, politics, and real talk.", icon: SVG_CHAT },
                    { id: "vent", code: "/vent/", title: "Venting / Off My Chest", desc: "Rants, personal struggles, confessions, and getting things off your chest.", icon: SVG_CHAT },
                    { id: "int", code: "/int/", title: "International", desc: "Languages, cultures, countries, and global discussion.", icon: SVG_CHAT }
                ]
            },
            {
                name: "Creative & Media",
                boards: [
                    { id: "brainrot", code: "/brainrot/", title: "Brainrot / Memes", desc: "Shitposts, memes, tier lists, copypastas, and pure chaos.", icon: SVG_CHAT },
                    { id: "art", code: "/art/", title: "Art & OCs", desc: "Drawings, original characters, edits, design, and creative showcases.", icon: SVG_CHAT },
                    { id: "media", code: "/media/", title: "Music, Vidya & Media", desc: "Video games, anime, movies, shows, music, and YouTube.", icon: SVG_CHAT },
                    { id: "tech", code: "/tech/", title: "Tech & Coding", desc: "PC builds, programming, web dev, Linux, phones, and AI.", icon: SVG_CHAT }
                ]
            },
            {
                name: "Off-Topic & Misc",
                boards: [
                    { id: "nsfw", code: "/nsfw/", title: "18+ / NSFW", desc: "Mature topics and edgy content. Strictly no illegal content.", icon: SVG_CHAT },
                    { id: "stories", code: "/stories/", title: "Greentexts & Stories", desc: "Storytimes, greentexts, lore, and creative writing.", icon: SVG_CHAT },
                    { id: "qna", code: "/qna/", title: "Questions & Advice", desc: "Ask the community anything, get help, or share advice.", icon: SVG_CHAT }
                ]
            }
        ];

        const PREFIX_COLORS = {
            "News": "#16a34a", "Serious": "#2563eb", "Discussion": "#7c3aed",
            "Question": "#0d9488", "Vent": "#6d28d9", "Media": "#d97706",
            "Art": "#db2777", "Tech": "#0284c7", "Brainrot": "#ea580c",
            "NSFW": "#dc2626", "Story": "#059669", "Help": "#ca8a04",
            "Announcement": "#e11d48"
        };

        function escapeHtml(s) {
            return String(s || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function roleClass(title) {
            const t = String(title || 'member').toLowerCase();
            if (t === 'owner') return 'role-owner';
            if (t === 'moderator' || t === 'mod') return 'role-moderator';
            if (t === 'janitor') return 'role-janitor';
            if (t === 'trusted') return 'role-trusted';
            return 'role-member';
        }

        document.getElementById('user-nav').innerHTML = username
            ? `<span class="nav-user-bar">Signed in as <a href="/profile.html?user=${encodeURIComponent(username)}"><strong>${escapeHtml(username)}</strong></a>${username === '20k' ? ' · <a href="/admin.html">Admin</a>' : ''} · <a href="#" onclick="showLogoutModal();return false;">Logout</a></span>`
            : `<a href="/login">Login</a> <a href="/register">Register</a>`;

        function showLogoutModal() {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.style.display = 'flex';
            modal.innerHTML = `<div class="modal-content" style="text-align:center;"><h3>Logout?</h3><p>Are you sure you want to logout?</p><button class="button" style="background:#dc2626;border-color:#dc2626;" onclick="localStorage.removeItem('username');location.href='/'">Yes, Logout</button> <button class="button-secondary" onclick="this.parentElement.parentElement.remove()">Cancel</button></div>`;
            document.body.appendChild(modal);
        }

        function timeAgo(date) {
            if (!date) return "";
            const s = Math.floor((Date.now() - new Date(date)) / 1000);
            if (s < 60) return "A moment ago";
            const m = Math.floor(s / 60);
            if (m < 60) return m + (m === 1 ? " minute ago" : " minutes ago");
            const h = Math.floor(m / 60);
            if (h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
            const d = Math.floor(h / 24);
            return d + (d === 1 ? " day ago" : " days ago");
        }

        function prefixBadge(prefix) {
            if (!prefix) return "";
            const color = PREFIX_COLORS[prefix] || "#2563eb";
            return `<span class="prefix-badge" style="background:${color};">${escapeHtml(prefix)}</span>`;
        }

        function toggleCategory(headerEl) {
            const block = headerEl.parentElement;
            if (!block) return;
            block.classList.toggle('collapsed');
            const chev = headerEl.querySelector('.category-chevron');
            if (chev) chev.textContent = block.classList.contains('collapsed') ? '▾' : '▴';
        }

        function renderBoards(stats) {
            const container = document.getElementById('boardsContainer');
            container.innerHTML = CATEGORIES.map(cat => `
                <div class="category-block">
                    <div class="category-header" onclick="toggleCategory(this)">
                        <span>${escapeHtml(cat.name)}</span>
                        <span class="category-chevron">▴</span>
                    </div>
                    <div class="node-list">
                        ${cat.boards.map(b => {
                            const st = (stats && stats[b.id]) || { threads: 0, posts: 0, last: null };
                            let lastHtml = '<span style="color:#6d7891;">No posts yet</span>';
                            if (st.last) {
                                const threadUrl = '/thread.html?id=' + encodeURIComponent(st.last.threadId) +
                                    '&title=' + encodeURIComponent(st.last.title || '') +
                                    (st.last.postId ? '#post-' + encodeURIComponent(st.last.postId) : '');
                                lastHtml = `
                                    <img class="avatar-sq" src="${escapeHtml(st.last.pfp || 'https://i.imgur.com/oJCfWc8.png')}" alt="">
                                    <div class="node-last-info">
                                        <a class="node-last-title" href="${threadUrl}" title="${escapeHtml(st.last.title)}">${prefixBadge(st.last.prefix)}${escapeHtml(st.last.title)}</a>
                                        <div class="node-last-meta">
                                            ${timeAgo(st.last.at)} · <a href="/profile.html?user=${encodeURIComponent(st.last.user)}" class="role-member">${escapeHtml(st.last.user)}</a>
                                        </div>
                                    </div>
                                `;
                            }
                            return `
                                <div class="node-row">
                                    <div class="node-icon">${b.icon}</div>
                                    <div class="node-main">
                                        <div class="node-title-row">
                                            <a class="node-title-link" href="/thread-list.html?id=${encodeURIComponent(b.id)}">${escapeHtml(b.title)}</a>
                                            <span class="node-code">${escapeHtml(b.code)}</span>
                                        </div>
                                        <p class="node-desc">${escapeHtml(b.desc)}</p>
                                    </div>
                                    <div class="node-stats">
                                        <div class="node-stat-col">
                                            <span class="num">${st.threads || 0}</span>
                                            <span class="lbl">Threads</span>
                                        </div>
                                        <div class="node-stat-col">
                                            <span class="num">${st.posts || 0}</span>
                                            <span class="lbl">Messages</span>
                                        </div>
                                    </div>
                                    <div class="node-last">${lastHtml}</div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `).join('');
        }

        async function loadStats() {
            try {
                const res = await fetch('/api/forum-stats');
                const stats = await res.json();
                renderBoards(stats);
            } catch (e) {
                renderBoards({});
            }
        }

        const SVG_POLL_SMALL = '<svg class="svg-icon" style="width:12px;height:12px;color:#8c98b3;" title="Poll" viewBox="0 0 16 16"><path d="M4 11H2v3h2v-3zm5-4H7v7h2V7zm5-5v12h-2V2h2zm-2-1a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1h-2zM6 7a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7zm-5 4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1v-3z"/></svg>';

        async function loadRecentPosts() {
            const box = document.getElementById('recentPostsBox');
            try {
                const res = await fetch('/api/recent-posts');
                const items = await res.json();
                if (!Array.isArray(items) || !items.length) {
                    box.innerHTML = '<div style="color:#8c98b3;">No posts yet.</div>';
                    return;
                }
                box.innerHTML = items.map(item => {
                    const url = '/thread.html?id=' + encodeURIComponent(item.threadId) +
                        '&title=' + encodeURIComponent(item.title || '') +
                        (item.postId ? '#post-' + encodeURIComponent(item.postId) : '');
                    const boardLabel = BOARD_NAMES[item.forum_id] || ('s1k/' + item.forum_id + '/');
                    const viewerText = item.viewers > 0
                        ? ` <span class="viewer-count-inline">(${item.viewers} Viewers)</span>`
                        : '';
                    const pollIcon = item.hasPoll ? (' ' + SVG_POLL_SMALL) : '';
                    return `
                        <div class="recent-item">
                            <div class="avatar-wrap">
                                <img class="avatar-sq-sm" src="${escapeHtml(item.pfp || 'https://i.imgur.com/oJCfWc8.png')}" alt="">
                                ${item.online ? '<span class="online-dot"></span>' : ''}
                            </div>
                            <div class="recent-info">
                                <div>
                                    ${prefixBadge(item.prefix)}<a class="recent-title" href="${url}">${escapeHtml(item.title)}</a>${pollIcon}${viewerText}
                                </div>
                                <div class="recent-meta">
                                    Started by <a href="/profile.html?user=${encodeURIComponent(item.creator || item.user)}">${escapeHtml(item.creator || item.user)}</a> · ${timeAgo(item.at)} · Replies: ${item.replies || 0}
                                </div>
                                <div class="recent-meta">
                                    <a href="/thread-list.html?id=${encodeURIComponent(item.forum_id)}">${escapeHtml(boardLabel)}</a>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                box.innerHTML = '<div style="color:#8c98b3;">Could not load recent threads.</div>';
            }
        }

        function getGuestSessionKey() {
            let key = localStorage.getItem('xf_guest_sid');
            if (!key) {
                key = 'guest_' + Math.random().toString(36).slice(2, 10) + '_' + Date.now().toString(36);
                localStorage.setItem('xf_guest_sid', key);
            }
            return key;
        }

        async function loadOnlineAndTotals() {
            try {
                fetch('/api/heartbeat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username || null,
                        sessionKey: getGuestSessionKey(),
                        locationType: 'home',
                        locationId: 'forums'
                    })
                }).catch(() => {});
                const res = await fetch('/api/online-stats');
                const data = await res.json();
                document.getElementById('onlineCountNum').textContent = data.onlineCount || 0;
                document.getElementById('statThreads').textContent = data.threads || 0;
                document.getElementById('statPosts').textContent = data.posts || 0;
                document.getElementById('statMembers').textContent = data.members || 0;
                const newestEl = document.getElementById('statNewest');
                if (newestEl && data.newestMember) {
                    newestEl.innerHTML = `<a href="/profile.html?user=${encodeURIComponent(data.newestMember)}">${escapeHtml(data.newestMember)}</a>`;
                }

                const listEl = document.getElementById('onlineUsersList');
                if (!data.online || !data.online.length) {
                    listEl.innerHTML = '<span style="color:#8c98b3;">No registered users active right now.</span>';
                } else {
                    listEl.innerHTML = data.online.map((u, idx) => {
                        const cls = roleClass(u.title);
                        const comma = idx < data.online.length - 1 ? '<span style="color:#8c98b3;">,</span>' : '';
                        return `<a class="online-user-chip ${cls}" href="/profile.html?user=${encodeURIComponent(u.username)}">${escapeHtml(u.username)}</a>${comma}`;
                    }).join(' ');
                }
            } catch (e) {}
        }

        async function loadGlobalBanner() {
            try {
                const res = await fetch('/api/global-banner');
                const data = await res.json();
                const el = document.getElementById('global-banner');
                if (!el) return;
                if (data && data.active && (data.text || data.imageUrl)) {
                    let content = escapeHtml(data.text || "");
                    if (data.imageUrl) {
                        content += `<br><img src="${escapeHtml(data.imageUrl)}" style="max-width:100%; margin-top:8px;">`;
                    }
                    el.innerHTML = content;
                    el.style.display = 'block';
                } else {
                    el.style.display = 'none';
                }
            } catch (e) {}
        }

        async function checkBan() {
            const u = localStorage.getItem('username');
            if (!u) return;
            try {
                const res = await fetch(`/api/check-ban/${encodeURIComponent(u)}`);
                const data = await res.json();
                if (data.banned) {
                    localStorage.clear();
                    window.location.href = `/banned.html?reason=${encodeURIComponent(data.reason || 'No reason')}&type=${data.type || 'permanent'}`;
                }
            } catch (e) {}
        }

        async function loadAlertBadge() {
            if (!username) return;
            try {
                const res = await fetch(`/api/alerts/${encodeURIComponent(username)}`);
                if (!res.ok) return;
                const data = await res.json();
                const badge = document.getElementById('alert-badge');
                if (badge) {
                    if (data.unread > 0) {
                        badge.style.display = 'inline';
                        badge.textContent = data.unread > 99 ? '99+' : data.unread;
                    } else badge.style.display = 'none';
                }
                const inboxBadge = document.getElementById('inbox-badge');
                if (inboxBadge) {
                    if (data.unreadInbox > 0) {
                        inboxBadge.style.display = 'inline';
                        inboxBadge.textContent = data.unreadInbox > 99 ? '99+' : data.unreadInbox;
                    } else inboxBadge.style.display = 'none';
                }
            } catch (e) {}
        }

        renderBoards({});
        loadStats();
        loadRecentPosts();
        loadOnlineAndTotals();
        loadGlobalBanner();
        checkBan();
        loadAlertBadge();
        setInterval(checkBan, 8000);
        setInterval(loadAlertBadge, 15000);
        setInterval(loadOnlineAndTotals, 20000);
        setInterval(loadRecentPosts, 20000);
    </script>
</body>
</html>

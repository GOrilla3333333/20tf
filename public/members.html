<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members - 20Thousand Forums</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="https://i.imgur.com/oJCfWc8.png">
    <style>
        .members-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            background: #252d40;
            border: 1px solid #2d364d;
            border-bottom: none;
            border-radius: 3px 3px 0 0;
            padding: 0 12px;
        }
        .member-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
        }
        .member-tab {
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: #94a1bd;
            padding: 10px 12px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 12.5px;
        }
        .member-tab:hover {
            color: #ffffff;
        }
        .member-tab.active {
            color: #ffffff;
            border-bottom-color: #55a6f8;
        }
        .member-search-inline {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 0;
        }
        .member-search-inline input {
            padding: 5px 9px;
            font-size: 12.5px;
            width: 200px;
        }
        .members-list-block {
            background: #202738;
            border: 1px solid #2d364d;
            border-radius: 0 0 3px 3px;
            overflow: hidden;
        }
        .member-dir-row {
            display: grid;
            grid-template-columns: 44px minmax(0, 1fr) 150px 150px 140px;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-bottom: 1px solid #293247;
            background: #202738;
        }
        .member-dir-row:last-child {
            border-bottom: none;
        }
        .member-dir-row:hover {
            background: #242c3f;
        }
        .member-dir-main {
            min-width: 0;
        }
        .member-dir-name-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .member-dir-name {
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
        }
        .member-dir-name:hover {
            text-decoration: underline;
        }
        .member-dir-role {
            display: inline-block;
            background: #252d40;
            border: 1px solid #36415c;
            color: #dce2ec;
            font-size: 11px;
            padding: 0 6px;
            border-radius: 2px;
            font-weight: 600;
        }
        .member-dir-sub {
            font-size: 12px;
            color: #8c98b3;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .member-dir-stars {
            display: inline-flex;
            gap: 1px;
            color: #f59e0b;
        }
        .member-dir-col {
            font-size: 12px;
            color: #8c98b3;
        }
        .member-dir-col strong {
            color: #dce2ec;
        }
        @media (max-width: 780px) {
            .member-dir-row {
                grid-template-columns: 40px minmax(0, 1fr);
            }
            .member-dir-col {
                grid-column: 2;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <img src="https://i.imgur.com/oJCfWc8.png" class="logo" alt="Logo" onclick="window.location.href='/'">
            <h1 onclick="window.location.href='/'">20Thousand Forums</h1>
        </div>
    </header>

    <nav>
        <a href="/">Home</a>
        <a href="/forums">Boards</a>
        <a href="/members.html" class="active">Members</a>
        <a href="/watched.html">Watched</a>
        <a href="/bookmarks.html">Bookmarks</a>
        <a href="/search.html">Search</a>
        <a href="/inbox.html">Inbox <span id="inbox-badge" class="nav-badge" style="display:none;">0</span></a>
        <a href="/alerts.html">Alerts <span id="alert-badge" class="nav-badge" style="display:none;">0</span></a>
        <span id="user-nav"></span>
        <form action="/search.html" method="get" class="nav-search">
            <input name="q" placeholder="Search...">
            <button type="submit">Search</button>
        </form>
    </nav>

    <div class="container">
        <div class="breadcrumbs">
            <a href="/">Home</a>
            <span class="bc-sep">›</span>
            <span class="bc-current">Members</span>
        </div>

        <div class="p-body-header">
            <div>
                <h2 class="p-title-value">Registered Members</h2>
                <p class="p-description" id="membersTotalLabel">Browse community members, top posters, and staff.</p>
            </div>
        </div>

        <div class="members-toolbar">
            <div class="member-tabs">
                <button type="button" class="member-tab active" data-tab="all" onclick="switchMemberTab('all')">All Members</button>
                <button type="button" class="member-tab" data-tab="messages" onclick="switchMemberTab('messages')">Most Messages</button>
                <button type="button" class="member-tab" data-tab="reactions" onclick="switchMemberTab('reactions')">Highest Reaction Score</button>
                <button type="button" class="member-tab" data-tab="staff" onclick="switchMemberTab('staff')">Staff Members</button>
                <button type="button" class="member-tab" data-tab="recent" onclick="switchMemberTab('recent')">Recently Registered</button>
            </div>
            <div class="member-search-inline">
                <input type="text" id="memberSearchInput" placeholder="Find member..." oninput="onSearchInput()">
            </div>
        </div>

        <div class="members-list-block" id="membersListContainer">
            <div style="padding:18px;color:#8c98b3;">Loading members...</div>
        </div>

        <div style="margin-top:10px;display:flex;justify-content:flex-end;">
            <div id="membersPagination" class="page-buttons"></div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="site-footer-inner">
            <span>20Thousand Forums</span>
            <div>
                <a href="/">Home</a>
                <a href="/forums">Boards</a>
                <a href="/tos">Terms &amp; Rules</a>
            </div>
        </div>
    </footer>

    <script>
        const username = localStorage.getItem('username');
        let currentTab = 'all';
        let currentPage = 1;
        let searchTimer = null;

        const SVG_STAR = '<svg class="svg-icon" style="width:10px;height:10px;" viewBox="0 0 16 16"><path d="M3.612 15.443c-.386.198-.824-.149-.746-.592l.83-4.73L.173 6.765c-.329-.314-.158-.888.283-.95l4.898-.696L7.538.792c.197-.39.73-.39.927 0l2.184 4.327 4.898.696c.441.062.612.636.282.95l-3.522 3.356.83 4.73c.078.443-.36.79-.746.592L8 13.187l-4.389 2.256z"/></svg>';
        const SVG_ENVELOPE = '<svg class="svg-icon" style="width:12px;height:12px;" viewBox="0 0 16 16"><path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V4zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1H2zm13 2.383-4.708 2.825L15 11.105V5.383zm-.034 6.876-5.64-3.471L8 9.583l-1.326-.795-5.64 3.47A1 1 0 0 0 2 13h12a1 1 0 0 0 .966-.741zM1 11.105l4.708-2.897L1 5.383v5.722z"/></svg>';

        function escapeHtml(s) {
            return String(s || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function roleClass(title) {
            const t = String(title || 'member').toLowerCase();
            if (t === 'owner') return 'role-owner';
            if (t === 'moderator' || t === 'mod') return 'role-moderator';
            if (t === 'janitor') return 'role-janitor';
            if (t === 'trusted') return 'role-trusted';
            return 'role-member';
        }

        document.getElementById('user-nav').innerHTML = username
            ? `<span class="nav-user-bar">Signed in as <a href="/profile.html?user=${encodeURIComponent(username)}"><strong>${escapeHtml(username)}</strong></a>${username === '20k' ? ' · <a href="/admin.html">Admin</a>' : ''} · <a href="#" onclick="showLogoutModal();return false;">Logout</a></span>`
            : '<a href="/login">Login</a> <a href="/register">Register</a>';

        function showLogoutModal() {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.style.display = 'flex';
            modal.innerHTML = `<div class="modal-content" style="text-align:center;"><h3>Logout?</h3><p>Are you sure you want to logout?</p><button class="button" style="background:#dc2626;border-color:#dc2626;" onclick="localStorage.removeItem('username');location.href='/'">Yes, Logout</button> <button class="button-secondary" onclick="this.parentElement.parentElement.remove()">Cancel</button></div>`;
            document.body.appendChild(modal);
        }

        function formatDate(d) {
            if (!d) return 'N/A';
            try {
                return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            } catch (e) {
                return 'N/A';
            }
        }

        function timeAgo(date) {
            if (!date) return 'Never';
            const s = Math.floor((Date.now() - new Date(date)) / 1000);
            if (s < 60) return 'Just now';
            const m = Math.floor(s / 60);
            if (m < 60) return m + 'm ago';
            const h = Math.floor(m / 60);
            if (h < 24) return h + 'h ago';
            const d = Math.floor(h / 24);
            if (d < 30) return d + 'd ago';
            return formatDate(date);
        }

        function switchMemberTab(tab) {
            currentTab = tab;
            currentPage = 1;
            document.querySelectorAll('.member-tab').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-tab') === tab);
            });
            loadMembers();
        }

        function onSearchInput() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                currentPage = 1;
                loadMembers();
            }, 220);
        }

        function goToMemberPage(p) {
            currentPage = p;
            loadMembers();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderPagination(totalPages) {
            const el = document.getElementById('membersPagination');
            if (totalPages <= 1) {
                el.innerHTML = '';
                return;
            }
            let html = '';
            if (currentPage > 1) {
                html += `<button class="page-btn" onclick="goToMemberPage(${currentPage - 1})">‹ Prev</button>`;
            }
            for (let p = 1; p <= totalPages; p++) {
                html += `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="goToMemberPage(${p})">${p}</button>`;
            }
            if (currentPage < totalPages) {
                html += `<button class="page-btn" onclick="goToMemberPage(${currentPage + 1})">Next ›</button>`;
            }
            el.innerHTML = html;
        }

        async function loadMembers() {
            const container = document.getElementById('membersListContainer');
            const q = document.getElementById('memberSearchInput').value.trim();
            try {
                const res = await fetch(`/api/members?tab=${encodeURIComponent(currentTab)}&q=${encodeURIComponent(q)}&page=${currentPage}`);
                const data = await res.json();
                if (!data.success) {
                    container.innerHTML = '<div style="padding:18px;color:#8c98b3;">Failed to load members.</div>';
                    return;
                }
                document.getElementById('membersTotalLabel').textContent =
                    `Showing ${data.members.length} of ${data.total} member${data.total === 1 ? '' : 's'}`;
                renderPagination(data.totalPages || 1);

                if (!data.members.length) {
                    container.innerHTML = '<div style="padding:18px;color:#8c98b3;">No members match your filter.</div>';
                    return;
                }

                container.innerHTML = data.members.map(m => {
                    const starCount = Math.min(5, Math.max(1, Number(m.stars) || 1));
                    const pmLink = (username && username !== m.username)
                        ? `<a href="/inbox.html?to=${encodeURIComponent(m.username)}" title="Start conversation" style="color:#8c98b3;">${SVG_ENVELOPE}</a>`
                        : '';
                    return `
                        <div class="member-dir-row">
                            <div class="avatar-wrap">
                                <a href="/profile.html?user=${encodeURIComponent(m.username)}">
                                    <img class="avatar-sq" src="${escapeHtml(m.pfp || 'https://i.imgur.com/oJCfWc8.png')}" alt="">
                                </a>
                                ${m.online ? '<span class="online-dot" title="Online now"></span>' : ''}
                            </div>
                            <div class="member-dir-main">
                                <div class="member-dir-name-row">
                                    <a class="member-dir-name ${roleClass(m.roleTitle || m.title)}" href="/profile.html?user=${encodeURIComponent(m.username)}">${escapeHtml(m.username)}</a>
                                    <span class="member-dir-role">${escapeHtml(m.title || 'Member')}</span>
                                    <span class="member-dir-stars">${SVG_STAR.repeat(starCount)}</span>
                                    ${pmLink}
                                </div>
                                <div class="member-dir-sub">
                                    ${m.customTitle ? `<span style="color:#d6deeb;">${escapeHtml(m.customTitle)}</span> · ` : ''}
                                    <span>Joined: ${formatDate(m.created_at)}</span>
                                </div>
                            </div>
                            <div class="member-dir-col">
                                <dl class="pairs-justified"><dt>Messages:</dt><dd><strong>${m.postCount || 0}</strong></dd></dl>
                            </div>
                            <div class="member-dir-col">
                                <dl class="pairs-justified"><dt>Reaction score:</dt><dd><strong>${m.reactionScore || 0}</strong></dd></dl>
                            </div>
                            <div class="member-dir-col" style="text-align:right;">
                                <span style="display:block;font-size:11px;">Last seen</span>
                                <strong>${m.online ? '<span style="color:#34d399;">Online now</span>' : escapeHtml(timeAgo(m.lastActive))}</strong>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                container.innerHTML = '<div style="padding:18px;color:#8c98b3;">Failed to load members.</div>';
            }
        }

        async function loadAlertBadge() {
            if (!username) return;
            try {
                const res = await fetch(`/api/alerts/${encodeURIComponent(username)}`);
                if (!res.ok) return;
                const data = await res.json();
                const badge = document.getElementById('alert-badge');
                if (badge) {
                    if (data.unread > 0) {
                        badge.style.display = 'inline';
                        badge.textContent = data.unread > 99 ? '99+' : data.unread;
                    } else badge.style.display = 'none';
                }
                const inboxBadge = document.getElementById('inbox-badge');
                if (inboxBadge) {
                    if (data.unreadInbox > 0) {
                        inboxBadge.style.display = 'inline';
                        inboxBadge.textContent = data.unreadInbox > 99 ? '99+' : data.unreadInbox;
                    } else inboxBadge.style.display = 'none';
                }
            } catch (e) {}
        }

        loadMembers();
        loadAlertBadge();
        setInterval(loadAlertBadge, 15000);
    </script>
</body>
</html>

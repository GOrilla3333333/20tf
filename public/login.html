<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - 20Thousand Forums</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .form-container {
            max-width: 400px;
            margin: 80px auto;
            background: #1e2f4f;
            padding: 40px;
            border-radius: 12px;
            border: 2px solid #0165fc;
            text-align: center;
        }
        .notification {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            padding: 15px 25px; border-radius: 6px; z-index: 20000;
            color: white; font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Login</h1>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required><br><br>
            <input type="password" id="password" placeholder="Password" required><br><br>
            <button type="submit" class="button">Login</button>
        </form>
        <p><a href="/register">Don't have an account? Register</a></p>
    </div>

    <script>
        function showNotification(text, color) {
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.style.background = color;
            notif.textContent = text;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 2800);
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                showNotification("Please fill all fields", "#ff4444");
                return;
            }

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                
                if (data.success) {
                    localStorage.setItem('username', username);   // ← Fixed here
                    showNotification("Login successful! Redirecting...", "#00cc66");
                    
                    setTimeout(() => {
                        window.location.href = '/forums';
                    }, 1000);
                } else {
                    showNotification(data.message || "Invalid username or password", "#ff4444");
                }
            } catch (err) {
                showNotification("Cannot connect to server", "#ff4444");
            }
        });
    </script>
</body>
</html>

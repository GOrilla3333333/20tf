<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - 20Thousand Forums</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="https://i.imgur.com/oJCfWc8.png">
    <style>
        .auth-wrap {
            max-width: 520px;
            margin: 32px auto;
        }
        .form-row {
            display: grid;
            grid-template-columns: 140px 1fr;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid #293247;
        }
        .form-row label {
            color: #cbd5e1;
            font-size: 13px;
            text-align: right;
            font-weight: 500;
        }
        .form-row input {
            width: 100%;
        }
        .form-submit-row {
            padding: 12px 16px;
            background: #1b2130;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        @media (max-width: 520px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 6px;
            }
            .form-row label {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <img src="https://i.imgur.com/oJCfWc8.png" class="logo" alt="Logo" onclick="window.location.href='/'">
            <h1 onclick="window.location.href='/'">20Thousand Forums</h1>
        </div>
    </header>

    <nav>
        <a href="/">Home</a>
        <a href="/forums">Boards</a>
        <a href="/login" class="active">Login</a>
        <a href="/register">Register</a>
    </nav>

    <div class="container">
        <div class="auth-wrap">
            <div class="breadcrumbs">
                <a href="/">Home</a>
                <span class="bc-sep">›</span>
                <span class="bc-current">Log in</span>
            </div>

            <div class="xf-block">
                <div class="xf-block-header">Log in</div>
                <form id="loginForm">
                    <div class="form-row">
                        <label for="username">Your name:</label>
                        <input type="text" id="username" required autofocus>
                    </div>
                    <div class="form-row">
                        <label for="password">Password:</label>
                        <input type="password" id="password" required>
                    </div>
                    <div class="form-submit-row">
                        <span style="font-size:12.5px;color:#8c98b3;">Don't have an account? <a href="/register">Register now</a></span>
                        <button type="submit" class="button">Log in</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="site-footer-inner">
            <span>20Thousand Forums</span>
            <div>
                <a href="/">Home</a>
                <a href="/forums">Boards</a>
                <a href="/tos">Terms &amp; Rules</a>
            </div>
        </div>
    </footer>

    <script>
        function showNotification(text, color) {
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.style.background = color;
            notif.textContent = text;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 2800);
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                showNotification("Please fill all fields", "#dc2626");
                return;
            }

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                
                if (data.success) {
                    localStorage.setItem('username', username);

                    if (data.redirect) {
                        showNotification("Please accept the Terms of Service", "#d97706");
                        setTimeout(() => {
                            window.location.href = data.redirect;
                        }, 800);
                    } else {
                        showNotification("Login successful! Redirecting...", "#16a34a");
                        setTimeout(() => {
                            window.location.href = '/forums';
                        }, 800);
                    }
                } else {
                    showNotification(data.message || "Invalid username or password", "#dc2626");
                }
            } catch (err) {
                showNotification("Cannot connect to server", "#dc2626");
            }
        });
    </script>
</body>
</html>

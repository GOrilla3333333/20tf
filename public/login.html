<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - 20Thousand Forums</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="https://i.imgur.com/oJCfWc8.png">
    <style>
        .form-container {
            max-width: 400px;
            margin: 60px auto;
            background: #1e2f4f;
            padding: 36px 32px;
            border-radius: 12px;
            border: 2px solid #0165fc;
            box-shadow: 0 8px 26px rgba(0, 0, 0, 0.35);
            text-align: center;
        }
        .form-container input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            margin-bottom: 14px;
            border-radius: 8px;
            border: 2px solid #0165fc;
            background: #0f1b2e;
            color: #ffffff;
            font-family: inherit;
            font-size: 1em;
            outline: none;
        }
        .form-container input:focus {
            border-color: #fffd01;
        }
        .form-container a {
            color: #fffd01;
            text-decoration: none;
            font-weight: bold;
        }
        .form-container a:hover {
            text-decoration: underline;
        }
        .notification {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            padding: 15px 25px; border-radius: 6px; z-index: 20000;
            color: white; font-weight: bold;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
        }
    </style>
</head>
<body>
    <header>
        <img src="https://i.imgur.com/oJCfWc8.png" class="logo" alt="Logo" onclick="window.location.href='/'">
        <h1>20Thousand Forums</h1>
    </header>

    <nav>
        <a href="/">Home</a>
        <a href="/forums">Boards</a>
        <a href="/login" class="active">Login</a>
        <a href="/register">Register</a>
    </nav>

    <div class="form-container">
        <h1 style="margin-bottom:20px;">Login</h1>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="button" style="width:100%;padding:12px;">Login</button>
        </form>
        <p style="margin-top:18px;color:#9fb3c8;">Don't have an account? <a href="/register">Register</a></p>
    </div>

    <script>
        function showNotification(text, color) {
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.style.background = color;
            notif.textContent = text;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 2800);
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                showNotification("Please fill all fields", "#ff4444");
                return;
            }

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                
                if (data.success) {
                    localStorage.setItem('username', username);

                    if (data.redirect) {
                        showNotification("Please accept the Terms of Service", "#ffaa00");
                        setTimeout(() => {
                            window.location.href = data.redirect;
                        }, 800);
                    } else {
                        showNotification("Login successful! Redirecting...", "#00cc66");
                        setTimeout(() => {
                            window.location.href = '/forums';
                        }, 1000);
                    }
                } else {
                    showNotification(data.message || "Invalid username or password", "#ff4444");
                }
            } catch (err) {
                showNotification("Cannot connect to server", "#ff4444");
            }
        });
    </script>
</body>
</html>

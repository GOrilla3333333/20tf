<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Suspended - 20Thousand Forums</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="https://i.imgur.com/oJCfWc8.png">
    <style>
        .ban-body {
            padding: 24px;
            text-align: center;
        }
        .ban-img {
            width: 200px;
            border: 1px solid #dc2626;
            border-radius: 2px;
            margin: 0 auto 16px auto;
        }
        .ban-title {
            font-size: 19px;
            font-weight: 700;
            color: #f87171;
            margin: 0 0 12px 0;
        }
        .ban-meta {
            background: #1b2130;
            border: 1px solid #2d364d;
            border-radius: 2px;
            padding: 12px 16px;
            margin: 14px 0;
            text-align: left;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <img src="https://i.imgur.com/oJCfWc8.png" class="logo" alt="Logo" onclick="window.location.href='/'">
            <h1 onclick="window.location.href='/'">20Thousand Forums</h1>
        </div>
    </header>

    <div class="container" style="max-width:600px; margin-top:40px;">
        <div class="xf-block">
            <div class="xf-block-header">Account Restriction Notice</div>
            <div class="ban-body">
                <img src="https://i.imgflip.com/6vvwv2.png" alt="Suspended" class="ban-img">
                <h1 class="ban-title">Your account has been suspended from 20Thousand Forums.</h1>

                <div class="ban-meta">
                    <dl class="pairs-justified" style="font-size:13px;">
                        <dt>Reason:</dt>
                        <dd id="reason-text" style="color:#eceff4; font-weight:600;"></dd>
                    </dl>
                    <dl class="pairs-justified" style="font-size:13px; margin-top:6px;">
                        <dt>Duration:</dt>
                        <dd id="days-text" style="color:#f59e0b; font-weight:600;"></dd>
                    </dl>
                </div>

                <p style="font-size:13px; color:#9aa6bf; line-height:1.6; margin: 14px 0 20px 0;">
                    Your account was restricted for violating the <a href="/commandments.html">forum rules</a>. If you believe this restriction was issued in error, you may contact staff at <strong>freedombegins248@gmail.com</strong>.
                </p>

                <button class="button" style="background:#dc2626; border-color:#dc2626;" onclick="logout()">Log out</button>
            </div>
        </div>
    </div>

    <audio id="banAudio" autoplay loop>
        <source src="https://mp3tourl.com/audio/1778251987629-fb26ce13-605b-491f-9d9b-bc3854281186.mp3" type="audio/mpeg">
    </audio>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('reason-text').textContent = urlParams.get('reason') || "No reason specified";

        const type = urlParams.get('type');
        document.getElementById('days-text').textContent =
            type === "permanent" ? "Permanent" : "7 Days";

        function logout() {
            localStorage.removeItem('username');
            window.location.href = '/';
        }

        const audio = document.getElementById('banAudio');
        audio.volume = 0.7;

        async function tryPlayAudio() {
            try {
                await audio.play();
            } catch (e) {}
        }

        window.addEventListener('load', tryPlayAudio);

        document.addEventListener('click', () => {
            audio.play().catch(() => {});
        }, { once: true });

        document.addEventListener('keydown', () => {
            audio.play().catch(() => {});
        }, { once: true });
    </script>
</body>
</html>

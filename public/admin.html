<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - 20Thousand Forums</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="https://i.imgur.com/oJCfWc8.png">
    <style>
        .admin-section {
            background: #202738;
            border: 1px solid #2d364d;
            border-radius: 3px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        .admin-section-body {
            padding: 14px 16px;
        }
        .admin-section-body input,
        .admin-section-body select,
        .admin-section-body textarea {
            width: 100%;
            max-width: 420px;
            margin: 4px 0 10px 0;
            display: block;
        }
        .admin-section-body button.danger {
            background: #dc2626;
            border-color: #dc2626;
        }
        .hint { color: #8c98b3; font-size: 12px; margin: 0 0 10px 0; }

        .member-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            background: #1b2130;
            border: 1px solid #2d364d;
            border-radius: 2px;
            padding: 10px 12px;
            margin-bottom: 8px;
        }
        .member-info { flex: 1; min-width: 140px; }
        .member-info strong { color: #eceff4; }
        .member-info .title-tag {
            display: inline-block;
            background: #252d40;
            border: 1px solid #36415c;
            color: #dce2ec;
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 2px;
            margin-left: 6px;
        }
        .member-info .banned-tag {
            display: inline-block;
            background: #2b1d24;
            border: 1px solid #5c2833;
            color: #f87171;
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 2px;
            margin-left: 6px;
        }
        .member-ban-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            flex: 2;
            min-width: 260px;
        }
        .member-ban-controls input,
        .member-ban-controls select {
            width: auto;
            max-width: none;
            margin: 0;
            padding: 6px 8px;
            font-size: 12.5px;
            display: inline-block;
        }
        .member-ban-controls input.reason { flex: 1; min-width: 120px; }

        .mention-dropdown {
            position: fixed;
            z-index: 30000;
            background: #181f30;
            border: 1px solid #2d364d;
            border-radius: 3px;
            max-height: 220px;
            overflow-y: auto;
            min-width: 200px;
            display: none;
        }
        .mention-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 12px;
            cursor: pointer;
            color: #e5e9f0;
        }
        .mention-item:hover, .mention-item.active { background: #252d40; }
        .mention-item img { width: 26px; height: 26px; border-radius: 2px; object-fit: cover; }
        .mention-item .mi-name { font-weight: 600; font-size: 12.5px; }
        .mention-item .mi-title { font-size: 11px; color: #8c98b3; }

        #memberSearch {
            max-width: 100%;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <img src="https://i.imgur.com/oJCfWc8.png" alt="Logo" class="logo" onclick="window.location.href='/'">
            <h1 onclick="window.location.href='/'">20Thousand Forums</h1>
        </div>
    </header>

    <nav>
        <a href="/">Home</a>
        <a href="/forums">Boards</a>
        <a href="/members.html">Members</a>
        <a href="/watched.html">Watched</a>
        <a href="/bookmarks.html">Bookmarks</a>
        <a href="/search.html">Search</a>
        <a href="/inbox.html">Inbox <span id="inbox-badge" class="nav-badge" style="display:none;">0</span></a>
        <a href="/alerts.html">Alerts <span id="alert-badge" class="nav-badge" style="display:none;">0</span></a>
        <a href="/admin.html" class="active">Admin Panel</a>
    </nav>

    <div class="container" style="max-width:960px;">
        <div class="breadcrumbs">
            <a href="/">Home</a>
            <span class="bc-sep">›</span>
            <span class="bc-current">Admin Panel</span>
        </div>
        <div id="content"></div>
    </div>
    <div id="mentionDropdown" class="mention-dropdown"></div>

    <footer class="site-footer">
        <div class="site-footer-inner">
            <span>20Thousand Forums</span>
            <div>
                <a href="/">Home</a>
                <a href="/forums">Boards</a>
                <a href="/tos">Terms &amp; Rules</a>
            </div>
        </div>
    </footer>

    <script>
        const username = localStorage.getItem('username');
        let mentionState = { active: false, start: -1, query: '', index: 0, list: [], boxId: 'bannerText' };
        let allMembers = [];

        function escapeHtml(s) {
            return String(s || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function hideMentionDropdown() {
            mentionState.active = false;
            const dd = document.getElementById('mentionDropdown');
            if (dd) dd.style.display = 'none';
        }

        async function updateMentionDropdown(textarea) {
            const val = textarea.value;
            const pos = textarea.selectionStart;
            const before = val.slice(0, pos);
            const match = before.match(/@([a-zA-Z0-9_]*)$/);
            if (!match) { hideMentionDropdown(); return; }
            mentionState.active = true;
            mentionState.start = pos - match[0].length;
            mentionState.query = match[1];
            mentionState.boxId = textarea.id;
            try {
                const res = await fetch('/api/users/suggest?q=' + encodeURIComponent(mentionState.query));
                mentionState.list = await res.json() || [];
                mentionState.index = 0;
            } catch (e) { mentionState.list = []; }
            const dd = document.getElementById('mentionDropdown');
            if (!mentionState.list.length) { dd.style.display = 'none'; return; }
            dd.innerHTML = mentionState.list.map(function (u, i) {
                return '<div class="mention-item ' + (i === 0 ? 'active' : '') + '" onmousedown="event.preventDefault();pickMention(' + i + ')">' +
                    '<img src="' + escapeHtml(u.pfp) + '" alt="">' +
                    '<div><div class="mi-name">@' + escapeHtml(u.username) + '</div>' +
                    '<div class="mi-title">' + escapeHtml(u.title || 'Member') + '</div></div></div>';
            }).join('');
            const rect = textarea.getBoundingClientRect();
            dd.style.left = rect.left + 'px';
            dd.style.top = (rect.bottom + 4) + 'px';
            dd.style.width = Math.min(rect.width, 280) + 'px';
            dd.style.display = 'block';
        }

        function pickMention(i) {
            const u = mentionState.list[i];
            if (!u) return;
            const box = document.getElementById(mentionState.boxId);
            if (!box) return;
            const val = box.value;
            const pos = box.selectionStart;
            const before = val.slice(0, mentionState.start);
            const after = val.slice(pos);
            const insert = '@' + u.username + ' ';
            box.value = before + insert + after;
            const newPos = before.length + insert.length;
            box.focus();
            box.setSelectionRange(newPos, newPos);
            hideMentionDropdown();
        }

        function bindMentionBox(id) {
            const box = document.getElementById(id);
            if (!box) return;
            box.addEventListener('input', function () { updateMentionDropdown(this); });
            box.addEventListener('blur', function () { setTimeout(hideMentionDropdown, 150); });
            box.addEventListener('keydown', function (e) {
                if (!mentionState.active || !mentionState.list.length) return;
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    mentionState.index = (mentionState.index + 1) % mentionState.list.length;
                    document.querySelectorAll('.mention-item').forEach(function (el, idx) {
                        el.classList.toggle('active', idx === mentionState.index);
                    });
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    mentionState.index = (mentionState.index - 1 + mentionState.list.length) % mentionState.list.length;
                    document.querySelectorAll('.mention-item').forEach(function (el, idx) {
                        el.classList.toggle('active', idx === mentionState.index);
                    });
                } else if (e.key === 'Enter' || e.key === 'Tab') {
                    e.preventDefault();
                    pickMention(mentionState.index);
                } else if (e.key === 'Escape') hideMentionDropdown();
            });
        }

        if (username !== '20k') {
            document.getElementById('content').innerHTML =
                '<div class="xf-block"><div class="xf-block-body" style="color:#f87171;">Access Denied. This area is restricted to the site owner.</div></div>';
        } else {
            document.getElementById('content').innerHTML =
                '<div class="admin-section">' +
                    '<div class="xf-block-header">Global Banner</div>' +
                    '<div class="admin-section-body">' +
                        '<input type="text" id="bannerText" placeholder="Banner text">' +
                        '<input type="text" id="bannerImage" placeholder="Image URL (optional)">' +
                        '<button class="button" onclick="updateBanner()">Update Banner</button> ' +
                        '<button class="button danger" onclick="clearBanner()">Clear Banner</button>' +
                    '</div>' +
                '</div>' +

                '<div class="admin-section">' +
                    '<div class="xf-block-header">Member Watch</div>' +
                    '<div class="admin-section-body">' +
                        '<p class="hint">All registered members. Ban or unban directly from each row.</p>' +
                        '<input type="text" id="memberSearch" placeholder="Filter by username..." oninput="filterMembers()">' +
                        '<div id="memberList">Loading members...</div>' +
                    '</div>' +
                '</div>' +

                '<div class="admin-section">' +
                    '<div class="xf-block-header">Set User Role &amp; Custom Title</div>' +
                    '<div class="admin-section-body">' +
                        '<p class="hint">Set staff/role title or override custom user title shown on postbits and profiles.</p>' +
                        '<input type="text" id="titleUsername" placeholder="Username">' +
                        '<select id="titlePreset" onchange="if(this.value) document.getElementById(\'titleCustom\').value = this.value">' +
                            '<option value="">(Select role preset)</option>' +
                            '<option value="Member">Member</option>' +
                            '<option value="Janitor">Janitor</option>' +
                            '<option value="Moderator">Moderator</option>' +
                            '<option value="Trusted">Trusted</option>' +
                            '<option value="Owner">Owner</option>' +
                        '</select>' +
                        '<input type="text" id="titleCustom" placeholder="Role title (or pick a preset)">' +
                        '<button class="button" onclick="setTitle()">Set Role Title</button>' +
                        '<div style="margin-top:12px;padding-top:12px;border-top:1px solid #293247;">' +
                            '<input type="text" id="overrideCustomTitle" placeholder="Custom user title override (optional)">' +
                            '<button class="button-secondary" onclick="setCustomTitleOverride()">Override Custom Title</button>' +
                        '</div>' +
                    '</div>' +
                '</div>' +

                '<div class="admin-section">' +
                    '<div class="xf-block-header">Post-Count Ranks &amp; Warning Thresholds</div>' +
                    '<div class="admin-section-body">' +
                        '<p class="hint">Configure automatic post-count rank thresholds and automatic warning point bans.</p>' +
                        '<div id="ranksConfigList" style="margin-bottom:12px;">Loading ranks...</div>' +
                        '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;">' +
                            '<div>' +
                                '<label style="font-size:12px;color:#8c98b3;">Points for 7-day Temp Ban</label>' +
                                '<input type="number" id="warnTempBanThreshold" value="5" min="1" max="50" style="width:120px;">' +
                            '</div>' +
                            '<div>' +
                                '<label style="font-size:12px;color:#8c98b3;">Points for Permanent Ban</label>' +
                                '<input type="number" id="warnPermBanThreshold" value="10" min="2" max="100" style="width:120px;">' +
                            '</div>' +
                        '</div>' +
                        '<button class="button" onclick="saveRanksAndThresholds()">Save Rank &amp; Warning Settings</button>' +
                    '</div>' +
                '</div>' +

                '<div class="admin-section">' +
                    '<div class="xf-block-header">Recent Moderation Warnings</div>' +
                    '<div class="admin-section-body">' +
                        '<p class="hint">All issued warnings across the forum.</p>' +
                        '<div id="adminWarningsList">Loading warnings...</div>' +
                    '</div>' +
                '</div>' +

                '<div class="admin-section">' +
                    '<div class="xf-block-header">Quick Ban</div>' +
                    '<div class="admin-section-body">' +
                        '<input type="text" id="banUsername" placeholder="Username to ban">' +
                        '<input type="text" id="banReason" placeholder="Reason">' +
                        '<select id="banType">' +
                            '<option value="permanent">Permanent</option>' +
                            '<option value="temporary">Temporary</option>' +
                        '</select>' +
                        '<button class="button danger" onclick="banUser()">Ban User</button>' +
                    '</div>' +
                '</div>' +

                '<div class="admin-section">' +
                    '<div class="xf-block-header">Delete Thread</div>' +
                    '<div class="admin-section-body">' +
                        '<input type="text" id="deleteThreadId" placeholder="Thread ID">' +
                        '<button class="button danger" onclick="deleteThread()">Delete Thread</button>' +
                    '</div>' +
                '</div>';

            bindMentionBox('bannerText');
            loadMembers();
            loadRanksAndThresholds();
            loadAdminWarnings();
        }

        async function loadMembers() {
            const list = document.getElementById('memberList');
            try {
                const res = await fetch('/api/admin/users?admin=' + encodeURIComponent('20k'));
                const data = await res.json();
                if (!data.success) {
                    list.innerHTML = '<p style="color:#f87171;">' + (data.message || 'Failed to load') + '</p>';
                    return;
                }
                allMembers = data.users || [];
                renderMembers(allMembers);
            } catch (e) {
                list.innerHTML = '<p style="color:#f87171;">Failed to load members</p>';
            }
        }

        function filterMembers() {
            const q = (document.getElementById('memberSearch').value || '').trim().toLowerCase();
            if (!q) return renderMembers(allMembers);
            renderMembers(allMembers.filter(function (u) {
                return (u.username || '').toLowerCase().indexOf(q) !== -1;
            }));
        }

        function renderMembers(users) {
            const list = document.getElementById('memberList');
            if (!users.length) {
                list.innerHTML = '<p style="color:#8c98b3;">No members found.</p>';
                return;
            }
            let html = '';
            users.forEach(function (u) {
                const safe = escapeHtml(u.username);
                const jsName = String(u.username).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                html += '<div class="member-row" data-user="' + safe + '">';
                html += '<img class="avatar-sq" src="' + escapeHtml(u.pfp) + '" alt="">';
                html += '<div class="member-info">';
                html += '<strong>' + safe + '</strong>';
                html += '<span class="title-tag">' + escapeHtml(u.title || 'Member') + '</span>';
                if (u.banned) {
                    html += '<span class="banned-tag">Banned' + (u.banType ? ' · ' + escapeHtml(u.banType) : '') + '</span>';
                    if (u.banReason) html += '<div style="font-size:11.5px;color:#f87171;margin-top:3px;">' + escapeHtml(u.banReason) + '</div>';
                }
                html += '</div>';
                if (u.username !== '20k') {
                    html += '<div class="member-ban-controls">';
                    html += '<input type="text" class="reason" id="reason-' + safe + '" placeholder="Ban reason">';
                    html += '<select id="type-' + safe + '"><option value="permanent">Permanent</option><option value="temporary">Temporary</option></select>';
                    html += '<button class="button danger" onclick="banFromList(\'' + jsName + '\')">Ban</button>';
                    if (u.banned) {
                        html += '<button class="button" style="background:#16a34a;border-color:#16a34a;" onclick="unbanFromList(\'' + jsName + '\')">Unban</button>';
                    }
                    html += '</div>';
                } else {
                    html += '<div style="color:#8c98b3;font-size:12px;">Owner</div>';
                }
                html += '</div>';
            });
            list.innerHTML = html;
        }

        async function banFromList(target) {
            if (target === '20k') return alert('Cannot ban owner');
            const reasonEl = document.getElementById('reason-' + target);
            const typeEl = document.getElementById('type-' + target);
            const reason = reasonEl ? reasonEl.value.trim() : '';
            const type = typeEl ? typeEl.value : 'permanent';
            if (!reason) return alert('Enter a ban reason');
            if (!confirm('Ban ' + target + ' (' + type + ')?\nReason: ' + reason)) return;

            const res = await fetch('/api/admin/ban', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    admin: '20k',
                    targetUsername: target,
                    reason: reason,
                    type: type
                })
            });
            const data = await res.json();
            alert(data.message);
            if (data.success) loadMembers();
        }

        async function unbanFromList(target) {
            if (!confirm('Unban ' + target + '?')) return;
            const res = await fetch('/api/admin/unban', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ admin: '20k', targetUsername: target })
            });
            const data = await res.json();
            alert(data.message);
            if (data.success) loadMembers();
        }

        async function updateBanner() {
            const text = document.getElementById('bannerText').value;
            const imageUrl = document.getElementById('bannerImage').value;
            const res = await fetch('/api/admin/banner', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: '20k', text: text, imageUrl: imageUrl })
            });
            const data = await res.json();
            alert(data.message || 'Done');
            hideMentionDropdown();
        }

        async function clearBanner() {
            const res = await fetch('/api/admin/banner', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: '20k', text: '', imageUrl: '' })
            });
            const data = await res.json();
            alert(data.message || 'Banner cleared');
            document.getElementById('bannerText').value = '';
            document.getElementById('bannerImage').value = '';
            hideMentionDropdown();
        }

        async function setTitle() {
            const targetUsername = document.getElementById('titleUsername').value.trim();
            const title = document.getElementById('titleCustom').value.trim() || 'Member';
            if (!targetUsername) return alert('Enter username');
            const res = await fetch('/api/admin/title', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ admin: '20k', targetUsername: targetUsername, title: title })
            });
            const data = await res.json();
            alert(data.message);
            if (data.success) loadMembers();
        }

        async function setCustomTitleOverride() {
            const targetUsername = document.getElementById('titleUsername').value.trim();
            const customTitle = document.getElementById('overrideCustomTitle').value.trim();
            if (!targetUsername) return alert('Enter username first');
            const res = await fetch('/api/admin/custom-title', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ admin: '20k', targetUsername: targetUsername, customTitle: customTitle })
            });
            const data = await res.json();
            alert(data.message || 'Updated');
            if (data.success) loadMembers();
        }

        async function loadRanksAndThresholds() {
            const listEl = document.getElementById('ranksConfigList');
            if (!listEl) return;
            try {
                const res = await fetch('/api/ranks');
                const data = await res.json();
                const ranks = data.ranks || [];
                if (data.thresholds) {
                    document.getElementById('warnTempBanThreshold').value = data.thresholds.tempBanPoints || 5;
                    document.getElementById('warnPermBanThreshold').value = data.thresholds.permBanPoints || 10;
                }
                listEl.innerHTML = ranks.map(function (r, idx) {
                    return '<div class="rank-cfg-row" style="display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap;">' +
                        '<input type="text" class="rank-name-inp" value="' + escapeHtml(r.name) + '" placeholder="Rank Name" style="width:150px;margin:0;">' +
                        '<span style="font-size:12px;color:#8c98b3;">Min Posts:</span>' +
                        '<input type="number" class="rank-posts-inp" value="' + Number(r.minPosts || 0) + '" min="0" style="width:90px;margin:0;">' +
                        '<span style="font-size:12px;color:#8c98b3;">Stars (1-5):</span>' +
                        '<input type="number" class="rank-stars-inp" value="' + Number(r.stars || 1) + '" min="1" max="5" style="width:70px;margin:0;">' +
                    '</div>';
                }).join('');
            } catch (e) {
                listEl.innerHTML = '<span style="color:#f87171;">Failed to load ranks</span>';
            }
        }

        async function saveRanksAndThresholds() {
            const rows = Array.from(document.querySelectorAll('.rank-cfg-row'));
            const ranks = rows.map(function (row) {
                return {
                    name: row.querySelector('.rank-name-inp').value.trim(),
                    minPosts: Number(row.querySelector('.rank-posts-inp').value) || 0,
                    stars: Number(row.querySelector('.rank-stars-inp').value) || 1
                };
            }).filter(function (r) { return r.name; });

            const thresholds = {
                tempBanPoints: Number(document.getElementById('warnTempBanThreshold').value) || 5,
                permBanPoints: Number(document.getElementById('warnPermBanThreshold').value) || 10
            };

            const res = await fetch('/api/admin/ranks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ admin: '20k', ranks: ranks, thresholds: thresholds })
            });
            const data = await res.json();
            alert(data.message || 'Saved');
            if (data.success) loadRanksAndThresholds();
        }

        async function loadAdminWarnings() {
            const listEl = document.getElementById('adminWarningsList');
            if (!listEl) return;
            try {
                const res = await fetch('/api/admin/warnings?moderator=' + encodeURIComponent(username || '20k'));
                const data = await res.json();
                if (!data.success || !Array.isArray(data.warnings) || !data.warnings.length) {
                    listEl.innerHTML = '<p style="color:#8c98b3;margin:0;">No warnings recorded yet.</p>';
                    return;
                }
                listEl.innerHTML = data.warnings.map(function (w) {
                    const jsId = String(w.id || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                    return '<div class="member-row">' +
                        '<div class="member-info">' +
                            '<a href="/profile.html?user=' + encodeURIComponent(w.user_id) + '"><strong>' + escapeHtml(w.user_id) + '</strong></a>' +
                            ' <span class="title-tag">' + escapeHtml(w.rule) + ' (' + w.points + ' pts)</span>' +
                            (w.active ? ' <span class="status-tag" style="color:#f59e0b;">Active</span>' : ' <span class="status-tag">Expired</span>') +
                            (w.reason ? '<div style="font-size:12px;color:#cbd5e1;margin-top:3px;">Note: ' + escapeHtml(w.reason) + '</div>' : '') +
                            '<div style="font-size:11px;color:#8c98b3;margin-top:2px;">By ' + escapeHtml(w.issued_by) + ' on ' + new Date(w.created_at).toLocaleDateString() + '</div>' +
                        '</div>' +
                        (w.active ? '<button class="button-secondary" onclick="revokeAdminWarning(\'' + jsId + '\')">Revoke</button>' : '') +
                    '</div>';
                }).join('');
            } catch (e) {
                listEl.innerHTML = '<p style="color:#f87171;">Failed to load warnings</p>';
            }
        }

        async function revokeAdminWarning(warnId) {
            if (!confirm('Revoke this warning?')) return;
            const res = await fetch('/api/warnings/' + encodeURIComponent(warnId), {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ moderator: username || '20k' })
            });
            const data = await res.json();
            if (data.success) loadAdminWarnings();
        }

        async function banUser() {
            const target = document.getElementById('banUsername').value.trim();
            const reason = document.getElementById('banReason').value.trim();
            const type = document.getElementById('banType').value;
            if (!target) return alert('Enter username');
            if (!reason) return alert('Enter a reason');
            const res = await fetch('/api/admin/ban', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ admin: '20k', targetUsername: target, reason: reason, type: type })
            });
            const data = await res.json();
            alert(data.message);
            if (data.success) loadMembers();
        }

        async function deleteThread() {
            const threadId = document.getElementById('deleteThreadId').value.trim();
            if (!threadId) return alert('Enter Thread ID');
            const res = await fetch('/api/admin/thread/' + threadId, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: '20k' })
            });
            const data = await res.json();
            alert(data.message);
        }
    </script>
</body>
</html>

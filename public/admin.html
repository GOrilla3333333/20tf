<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Panel - 20Thousand Forums</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="https://i.imgur.com/oJCfWc8.png">
    <style>
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; align-items: center;
            justify-content: center; z-index: 20000;
        }
        .modal-content {
            background: #1e2f4f; 
            padding: 25px; 
            border-radius: 12px;
            border: 3px solid #0165fc; 
            width: 90%; 
            max-width: 450px; 
            color: white;
            text-align: center;
        }
        .button {
            padding: 10px 20px;
            margin: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Mobile Improvements */
        body {
            font-size: 16px;
        }
        input, textarea, select, button {
            font-size: 16px !important;
        }
        .container, #content {
            padding: 10px 15px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
        }
        h2 {
            font-size: 1.7em;
        }
    </style>
</head>
<body>
    <header>
        <img src="https://i.imgur.com/oJCfWc8.png" alt="Logo" class="logo">
        <h1>Admin Panel</h1>
    </header>

    <nav><a href="/forums">← Back to Forums</a></nav>
    <hr>

    <div id="content"></div>

    <!-- Success Modal -->
    <div id="successModal" class="modal">
        <div class="modal-content" style="background:#00cc66; color:white;" id="successContent"></div>
    </div>

    <script>
        const username = localStorage.getItem('username');

        if (username !== "20k") {
            document.getElementById('content').innerHTML = `
                <h2 style="color:red; text-align:center; margin-top:100px;">
                    Access Denied.<br><br>
                    This area is restricted to the owner only.
                </h2>`;
        } else {
            document.getElementById('content').innerHTML = `
                <h2>Global Banner</h2>
                <input id="bannerText" placeholder="Banner text (HTML allowed)" style="width:100%; padding:12px;"><br><br>
                <input id="bannerImage" placeholder="Image URL (optional)" style="width:100%; padding:12px;"><br><br>
                <button onclick="updateBanner()" class="button">Update Banner</button>
                <button onclick="clearBanner()" class="button" style="background:#666;">Clear Banner</button>

                <hr>

                <h2>Ban User</h2>
                <input id="banUsername" placeholder="Username" style="width:100%; padding:12px;"><br><br>
                <input id="banReason" placeholder="Reason" style="width:100%; padding:12px;"><br><br>
                <select id="banType" style="width:100%; padding:12px;">
                    <option value="temporary">Temporary (7 days)</option>
                    <option value="permanent" selected>Permanent</option>
                </select><br><br>
                <button onclick="banUser()" class="button" style="background:#ff4444;">Ban User</button>

                <hr>

                <h2>Delete Thread</h2>
                <input id="deleteThreadId" placeholder="Thread ID" style="width:100%; padding:12px;"><br><br>
                <button onclick="deleteThread()" class="button">Delete Thread</button>

                <hr>

                <h2>Reports</h2>
                <p><a href="/reports.html">📋 View All Reports</a></p>
            `;
        }

        function showSuccessModal(message) {
            const modal = document.getElementById('successModal');
            document.getElementById('successContent').innerHTML = `<strong>${message}</strong>`;
            modal.style.display = 'flex';
            setTimeout(() => modal.style.display = 'none', 2500);
        }

        async function updateBanner() {
            const text = document.getElementById('bannerText').value.trim();
            const imageUrl = document.getElementById('bannerImage').value.trim();

            const res = await fetch('/api/admin/banner', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: "20k", text, imageUrl })
            });
            const data = await res.json();
            showSuccessModal(data.message || "Banner updated!");
        }

        async function clearBanner() {
            const res = await fetch('/api/admin/banner', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: "20k", text: "", imageUrl: "" })
            });
            const data = await res.json();
            showSuccessModal(data.message || "Banner cleared!");
        }

        async function banUser() {
            const target = document.getElementById('banUsername').value.trim();
            const reason = document.getElementById('banReason').value.trim();
            const type = document.getElementById('banType').value;

            if (!target) return alert("Enter username");

            const res = await fetch('/api/admin/ban', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ admin: "20k", targetUsername: target, reason, type })
            });
            const data = await res.json();
            showSuccessModal(data.message || "User banned!");
        }

        async function deleteThread() {
            const threadId = document.getElementById('deleteThreadId').value.trim();
            if (!threadId) return alert("Enter Thread ID");

            const res = await fetch(`/api/admin/thread/${threadId}`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: "20k" })
            });
            const data = await res.json();
            showSuccessModal(data.message || "Thread deleted");
        }
    </script>
</body>
</html>

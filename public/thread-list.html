<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>20Thousand Forums</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="https://i.imgur.com/oJCfWc8.png">
    <style>
        .thread {
            background: #1e2f4f;
            border: 2px solid #0165fc;
            border-radius: 8px;
            padding: 14px 18px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .thread:hover {
            background: #2a3f5f;
            border-color: #fffd01;
        }
        .thread.pinned {
            border-left: 5px solid #fffd01;
            background: #2a3f5f;
        }
        .thread-main {
            flex: 1;
        }
        .thread-title {
            font-size: 1.2em;
            color: white;
            margin-bottom: 4px;
        }
        .thread-meta {
            color: #aaa;
            font-size: 0.9em;
        }
        .thread-stats {
            text-align: right;
            color: #ccc;
            font-size: 0.95em;
            min-width: 110px;
        }
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 25px;
            border-radius: 6px;
            z-index: 20000;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <img src="https://i.imgur.com/oJCfWc8.png" class="logo">
        <h1 id="board-title">Loading...</h1>
    </header>

    <nav>
        <a href="/forums">← Back to Boards</a> |
        <span id="user-nav"></span>
    </nav>

    <div class="container">
        <div style="margin: 15px 0;">
            <button onclick="showCreateModal()" class="button" style="background:#fffd01; color:#162437;">+ New d1sc</button>
        </div>

        <div id="threadsList">Loading discussions...</div>
    </div>

    <!-- Create Modal (kept simple) -->
    <div id="createModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); align-items:center; justify-content:center; z-index:10000;">
        <div style="background:#1e2f4f; padding:25px; border-radius:12px; border:3px solid #0165fc; width:90%; max-width:450px; color:white;">
            <h3>Create New d1sc</h3>
            <input id="modal-title" placeholder="Title" style="width:100%; padding:10px; margin:8px 0;"><br>
            <textarea id="modal-content" placeholder="Content" rows="5" style="width:100%; padding:10px;"></textarea><br>
            <input type="file" id="modal-file" accept="image/*,video/*" multiple><br><br>
            <button onclick="createD1sc()" style="background:#fffd01; color:#162437; padding:10px 20px;">Create</button>
            <button onclick="closeCreateModal()" style="margin-left:10px;">Cancel</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const forumId = urlParams.get('id');
        const forumName = urlParams.get('name') || forumId;
        const username = localStorage.getItem('username');

        document.getElementById('board-title').textContent = `/${forumId}/ — ${forumName}`;
        document.getElementById('user-nav').innerHTML = username 
            ? `Logged in as: <strong>${username}</strong>` 
            : '<a href="/login">Login</a>';

        async function loadThreads() {
            try {
                const res = await fetch(`/api/forums/${forumId}/threads`);
                const threads = await res.json();

                if (!Array.isArray(threads) || threads.length === 0) {
                    document.getElementById('threadsList').innerHTML = "<p>No discussions yet.</p>";
                    return;
                }

                // Sort pinned first
                threads.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));

                let html = '';
                threads.forEach(t => {
                    const date = t.created_at ? new Date(t.created_at).toLocaleDateString() : '';
                    html += `
                        <div class="thread ${t.pinned ? 'pinned' : ''}" onclick="window.location.href='/thread.html?id=${t.id}&title=${encodeURIComponent(t.title)}'">
                            <div class="thread-main">
                                <div class="thread-title">${t.pinned ? '📌 ' : ''}${t.title}</div>
                                <div class="thread-meta">
                                    ${t.user_id || 'Unknown'} • ${date}
                                </div>
                            </div>
                            <div class="thread-stats">
                                Replies: ${t.postCount || 0}<br>
                                Views: —
                            </div>
                        </div>`;
                });

                document.getElementById('threadsList').innerHTML = html;
            } catch (err) {
                console.error(err);
                document.getElementById('threadsList').innerHTML = "<p>Error loading discussions.</p>";
            }
        }

        function showCreateModal() {
            if (!username) return alert("Login first");
            document.getElementById('createModal').style.display = 'flex';
        }

        function closeCreateModal() {
            document.getElementById('createModal').style.display = 'none';
        }

        async function createD1sc() {
            const title = document.getElementById('modal-title').value.trim();
            const content = document.getElementById('modal-content').value.trim();
            const files = document.getElementById('modal-file').files;

            if (!title) return alert("Title required");

            let fileUrls = [];
            for (let file of files) {
                const fd = new FormData();
                fd.append('file', file);
                const r = await fetch('/api/upload', { method: 'POST', body: fd });
                const d = await r.json();
                if (d.success) fileUrls.push(d.url);
            }

            await fetch('/api/threads', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    title,
                    content,
                    forum_id: forumId,
                    username,
                    fileUrls
                })
            });

            closeCreateModal();
            loadThreads();
        }

        loadThreads();
    </script>
</body>
</html>

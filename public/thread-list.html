<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>20Thousand Forums</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="https://i.imgur.com/oJCfWc8.png">
    <style>
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; align-items: center;
            justify-content: center; z-index: 10000;
        }
        .modal-content {
            background: #1e2f4f; padding: 22px; border-radius: 4px;
            border: 1px solid #2b4570; width: 90%; max-width: 480px; color: white;
            max-height: 90vh; overflow-y: auto; position: relative;
        }
        .notification {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            padding: 12px 22px; border-radius: 4px; z-index: 20000;
            color: white; font-weight: bold;
        }
        .board-header-bar {
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 12px; background: #0f1c2e;
            border: 1px solid #2b4570; border-bottom: 2px solid #0165fc;
            border-radius: 4px; padding: 12px 16px; margin-bottom: 14px;
        }
        .board-header-bar h2 {
            margin: 0; color: #fffd01; font-size: 1.25em;
        }
        .prefix-filter-bar {
            display: none; align-items: center; flex-wrap: wrap; gap: 6px;
            margin-bottom: 12px; padding: 8px 12px;
            background: #0f1c2e; border: 1px solid #2b4570; border-radius: 4px;
        }
        .filter-pill {
            background: #1e2f4f; color: #c5d4eb; border: 1px solid #2b4570;
            border-radius: 3px; padding: 3px 10px; font-size: 0.8em; font-weight: bold;
            cursor: pointer; font-family: inherit;
        }
        .filter-pill:hover, .filter-pill.active {
            background: #0165fc; color: #ffffff; border-color: #0165fc;
        }
        .threads-block {
            border: 1px solid #2b4570;
            border-radius: 4px;
            background: #1e2f4f;
            overflow: hidden;
        }
        .thread {
            background: #1e2f4f; padding: 12px 44px 12px 16px; margin: 0;
            border-bottom: 1px solid #283e64; position: relative; cursor: pointer;
            display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
        }
        .thread:last-child { border-bottom: none; }
        .thread-main { flex: 1; min-width: 220px; }
        .thread-stats-col {
            display: flex; gap: 16px; text-align: center; font-size: 0.82em; color: #c5d4eb;
            min-width: 110px; justify-content: center;
        }
        .thread-stats-col strong {
            display: block; color: #ffffff; font-size: 1.08em;
        }
        .thread-lastpost {
            text-align: right; font-size: 0.84em; color: #c5d4eb; min-width: 155px;
            border-left: 1px solid #283e64; padding-left: 14px;
        }
        .thread-lastpost a { color: #7eb3ff; text-decoration: none; font-weight: bold; }
        .thread-lastpost a:hover { color: #fffd01; text-decoration: underline; }
        .bb-toolbar {
            display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px;
        }
        .bb-btn {
            background: #0f1b2e; color: #c5d4eb; border: 1px solid #2b4570;
            border-radius: 3px; padding: 4px 9px; font-size: 12px; cursor: pointer;
            font-family: inherit; font-weight: bold;
        }
        .bb-btn:hover { background: #0165fc; border-color: #0165fc; color: #fff; }
        .thread:hover { background: #24385c; }
        .pinned {
            background: #223556;
        }
        .status-tag {
            display: inline-flex; align-items: center; gap: 3px;
            font-size: 0.72em; padding: 1px 6px; border-radius: 3px;
            background: #0f1c2e; border: 1px solid #2b4570; color: #fffd01;
            margin-left: 6px; vertical-align: middle;
        }
        .menu-btn {
            position: absolute; top: 10px; right: 10px; background: none; border: none;
            font-size: 20px; cursor: pointer; color: #c5d4eb;
        }
        .dropdown-menu {
            display: none; position: absolute; top: 36px; right: 10px;
            background: #0f1b2e; border: 1px solid #2b4570; border-radius: 4px;
            z-index: 50; min-width: 140px;
        }
        .dropdown-menu button {
            display: block; width: 100%; text-align: left; background: none; border: none;
            color: white; padding: 9px 14px; cursor: pointer; font-family: inherit;
        }
        .dropdown-menu button:hover { background: #1e2f4f; color: #fffd01; }
        .prefix-badge {
            display: inline-block; padding: 2px 7px; border-radius: 3px;
            font-size: 0.74em; font-weight: bold; margin-right: 6px; color: #fff;
        }
        .prefix-select, .modal-content input[type="text"], .modal-content textarea {
            width: 100%; padding: 9px 10px; margin-bottom: 12px; border-radius: 4px;
            border: 1px solid #2b4570; background: #0f1b2e; color: white;
            font-size: 15px; box-sizing: border-box; font-family: inherit; outline: none;
        }
        .prefix-select:focus, .modal-content input[type="text"]:focus, .modal-content textarea:focus {
            border-color: #0165fc;
        }
        .modal-content textarea { min-height: 110px; resize: vertical; }
        .upload-status { font-size: 13px; color: #c5d4eb; margin-bottom: 10px; min-height: 18px; }
        .thread-title-line { color: #ffffff; font-size: 1.06em; font-weight: bold; word-break: break-word; }
        .thread:hover .thread-title-line { color: #fffd01; }
        .thread-meta { color: #c5d4eb; font-size: 0.85em; margin-top: 3px; }
        .thread-meta a { color: #7eb3ff; text-decoration: none; font-weight: bold; }
        .thread-meta a:hover { color: #fffd01; text-decoration: underline; }
        .mention-dropdown {
            position: fixed; z-index: 30000; background: #0f1b2e;
            border: 1px solid #2b4570; border-radius: 4px; max-height: 220px;
            overflow-y: auto; min-width: 200px; display: none;
        }
        .mention-item {
            display: flex; align-items: center; gap: 10px; padding: 8px 12px;
            cursor: pointer; color: white;
        }
        .mention-item:hover, .mention-item.active { background: #1e2f4f; }
        .mention-item img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
        .mention-item .mi-name { font-weight: bold; }
        .mention-item .mi-title { font-size: 0.75em; color: #c5d4eb; }
    </style>
</head>
<body>
    <header>
        <img src="https://i.imgur.com/oJCfWc8.png" alt="Logo" class="logo" onclick="window.location.href='/'">
        <h1>20Thousand Forums</h1>
    </header>

    <nav>
        <a href="/">Home</a>
        <a href="/forums" class="active">Boards</a>
        <a href="/search.html">Search</a>
        <a href="/alerts.html">Alerts <span id="alert-badge" style="display:none; background:#d93838; color:white; border-radius:3px; padding:1px 6px; font-size:11px; margin-left:4px;">0</span></a>
        <span id="user-nav"></span>
        <form action="/search.html" method="get" class="nav-search">
            <input name="q" placeholder="Search users or d1scs...">
            <button type="submit">Search</button>
        </form>
    </nav>

    <div id="global-banner" style="display:none; background:#fffd01; color:#162437; padding:10px 16px; text-align:center; font-weight:bold;"></div>

    <div class="container">
        <div class="breadcrumbs">
            <a href="/">Home</a>
            <span class="bc-sep">›</span>
            <a href="/forums">Boards</a>
            <span class="bc-sep">›</span>
            <span class="bc-current" id="bcBoardName">Board</span>
        </div>

        <div class="board-header-bar">
            <h2 id="boardTitle">Loading...</h2>
            <div id="createArea"></div>
        </div>

        <div id="prefixFilterBar" class="prefix-filter-bar"></div>
        <div id="threadsList" class="threads-block"><div style="padding:14px 16px;">Loading discussions...</div></div>
    </div>

    <div id="createModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0;color:#fffd01;">Create d1sc</h3>
            <select id="threadPrefix" class="prefix-select">
                <option value="">(No prefix)</option>
                <option value="News">News</option>
                <option value="Serious">Serious</option>
                <option value="Discussion">Discussion</option>
                <option value="Question">Question</option>
                <option value="Vent">Vent</option>
                <option value="Media">Media</option>
                <option value="Art">Art</option>
                <option value="Tech">Tech</option>
                <option value="Brainrot">Brainrot</option>
                <option value="NSFW">NSFW</option>
                <option value="Story">Story</option>
                <option value="Help">Help</option>
                <option value="Announcement">Announcement</option>
            </select>
            <input type="text" id="threadTitle" placeholder="Title" maxlength="120">
            <div class="bb-toolbar">
                <button type="button" class="bb-btn" onclick="insertTag('threadContent','[b]','[/b]')"><b>B</b></button>
                <button type="button" class="bb-btn" onclick="insertTag('threadContent','[i]','[/i]')"><i>I</i></button>
                <button type="button" class="bb-btn" onclick="insertTag('threadContent','[u]','[/u]')"><u>U</u></button>
                <button type="button" class="bb-btn" onclick="insertTag('threadContent','[s]','[/s]')"><s>S</s></button>
                <button type="button" class="bb-btn" onclick="insertTag('threadContent','[code]','[/code]')">Code</button>
                <button type="button" class="bb-btn" onclick="insertTag('threadContent','[spoiler=Spoiler]','[/spoiler]')">Spoiler</button>
            </div>
            <textarea id="threadContent" placeholder="Write your post..."></textarea>
            <div style="margin-bottom:8px;">
                <label for="threadFiles" class="attach-btn">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
                    <span>Attach image / video</span>
                </label>
                <input type="file" id="threadFiles" multiple accept="image/*,video/*" style="display:none;">
            </div>
            <div class="media-preview-list" id="modalMediaPreviewList"></div>
            <div class="upload-status" id="uploadStatus"></div>
            <div style="display:flex;gap:8px;justify-content:flex-end;">
                <button class="button" onclick="createThread()">Create d1sc</button>
                <button class="button" style="background:#2b4570;border-color:#2b4570;" onclick="closeCreateModal()">Cancel</button>
            </div>
        </div>
    </div>

    <div id="mentionDropdown" class="mention-dropdown"></div>

    <div id="deleteModal" class="modal">
        <div class="modal-content" style="text-align:center;">
            <h3>Delete d1sc?</h3>
            <p>This cannot be undone.</p>
            <button class="button" style="background:#d93838;border-color:#d93838;" onclick="confirmDelete()">Yes, Delete</button>
            <button class="button" style="background:#2b4570;border-color:#2b4570;" onclick="closeDeleteModal()">Cancel</button>
        </div>
    </div>

    <div id="reportModal" class="modal">
        <div class="modal-content">
            <h3>Report d1sc</h3>
            <textarea id="reportReason" placeholder="Reason"></textarea>
            <button class="button" onclick="submitReport()">Submit Report</button>
            <button class="button" style="background:#2b4570;border-color:#2b4570;" onclick="closeReportModal()">Cancel</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const forumId = params.get('id') || '';
        const forumName = params.get('name') || forumId;
        const username = localStorage.getItem('username');
        let pendingDeleteId = null;
        let pendingReportId = null;
        let uploadedUrls = [];
        let allBoardThreads = [];
        let activePrefixFilter = '';
        let mentionState = { active: false, start: -1, query: '', index: 0, list: [], boxId: 'threadContent' };

        const PREFIX_COLORS = {
            "News": "#2ecc71", "Serious": "#3498db", "Discussion": "#9b59b6",
            "Question": "#1abc9c", "Vent": "#8e44ad", "Media": "#e67e22",
            "Art": "#e91e63", "Tech": "#00bcd4", "Brainrot": "#ff5722",
            "NSFW": "#e74c3c", "Story": "#16a085", "Help": "#f39c12",
            "Announcement": "#fffd01"
        };

        function escapeHtml(s) {
            return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        const boardLabel = forumName && forumName !== forumId ? 's1k/' + forumId + '/ · ' + forumName : 's1k/' + forumId + '/';
        document.getElementById('boardTitle').textContent = boardLabel;
        document.getElementById('bcBoardName').textContent = 's1k/' + forumId + '/';
        document.getElementById('user-nav').innerHTML = username
            ? '<span class="nav-user-bar"><a href="/profile.html?user=' + encodeURIComponent(username) + '"><strong>' + escapeHtml(username) + '</strong></a>' + (username === '20k' ? ' · <a href="/admin.html">Admin</a>' : '') + ' · <a href="#" onclick="showLogoutModal();return false;">Logout</a></span>'
            : '<a href="/register">Register</a> <a href="/login">Login</a>';

        function prefixBadge(prefix) {
            if (!prefix) return '';
            const color = PREFIX_COLORS[prefix] || '#0165fc';
            const textColor = prefix === 'Announcement' ? '#162437' : '#fff';
            return '<span class="prefix-badge" style="background:' + color + ';color:' + textColor + '">' + escapeHtml(prefix) + '</span>';
        }

        function showNotification(text, color) {
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.style.background = color;
            notif.textContent = text;
            document.body.appendChild(notif);
            setTimeout(function () { notif.remove(); }, 2500);
        }

        function showLogoutModal() {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.style.display = 'flex';
            modal.innerHTML = '<div class="modal-content" style="text-align:center;"><h3>Logout?</h3><p>Are you sure?</p><button class="button" style="background:#d93838;border-color:#d93838;" onclick="localStorage.removeItem(\'username\');location.href=\'/\'">Yes, Logout</button> <button class="button" style="background:#2b4570;border-color:#2b4570;" onclick="this.parentElement.parentElement.remove()">Cancel</button></div>';
            document.body.appendChild(modal);
        }

        // Mentions
        function hideMentionDropdown() {
            mentionState.active = false;
            document.getElementById('mentionDropdown').style.display = 'none';
        }

        async function updateMentionDropdown(textarea) {
            const val = textarea.value;
            const pos = textarea.selectionStart;
            const before = val.slice(0, pos);
            const match = before.match(/@([a-zA-Z0-9_]*)$/);
            if (!match) { hideMentionDropdown(); return; }
            mentionState.active = true;
            mentionState.start = pos - match[0].length;
            mentionState.query = match[1];
            mentionState.boxId = textarea.id;
            try {
                const res = await fetch('/api/users/suggest?q=' + encodeURIComponent(mentionState.query));
                mentionState.list = await res.json() || [];
                mentionState.index = 0;
            } catch (e) { mentionState.list = []; }
            const dd = document.getElementById('mentionDropdown');
            if (!mentionState.list.length) { dd.style.display = 'none'; return; }
            dd.innerHTML = mentionState.list.map(function (u, i) {
                return '<div class="mention-item ' + (i === 0 ? 'active' : '') + '" onmousedown="event.preventDefault();pickMention(' + i + ')">' +
                    '<img src="' + escapeHtml(u.pfp) + '" alt=""><div><div class="mi-name">@' + escapeHtml(u.username) + '</div>' +
                    '<div class="mi-title">' + escapeHtml(u.title || 'Member') + '</div></div></div>';
            }).join('');
            const rect = textarea.getBoundingClientRect();
            dd.style.left = rect.left + 'px';
            dd.style.top = (rect.bottom + 4) + 'px';
            dd.style.width = Math.min(rect.width, 280) + 'px';
            dd.style.display = 'block';
        }

        function pickMention(i) {
            const u = mentionState.list[i];
            if (!u) return;
            const box = document.getElementById(mentionState.boxId);
            const val = box.value;
            const pos = box.selectionStart;
            const before = val.slice(0, mentionState.start);
            const after = val.slice(pos);
            const insert = '@' + u.username + ' ';
            box.value = before + insert + after;
            const newPos = before.length + insert.length;
            box.focus();
            box.setSelectionRange(newPos, newPos);
            hideMentionDropdown();
        }

        function bindMentionBox(id) {
            const box = document.getElementById(id);
            if (!box) return;
            box.addEventListener('input', function () { updateMentionDropdown(this); });
            box.addEventListener('blur', function () { setTimeout(hideMentionDropdown, 150); });
            box.addEventListener('keydown', function (e) {
                if (!mentionState.active || !mentionState.list.length) return;
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    mentionState.index = (mentionState.index + 1) % mentionState.list.length;
                    document.querySelectorAll('.mention-item').forEach(function (el, i) {
                        el.classList.toggle('active', i === mentionState.index);
                    });
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    mentionState.index = (mentionState.index - 1 + mentionState.list.length) % mentionState.list.length;
                    document.querySelectorAll('.mention-item').forEach(function (el, i) {
                        el.classList.toggle('active', i === mentionState.index);
                    });
                } else if (e.key === 'Enter' || e.key === 'Tab') {
                    e.preventDefault();
                    pickMention(mentionState.index);
                } else if (e.key === 'Escape') hideMentionDropdown();
            });
        }
        bindMentionBox('threadContent');

        async function canPostHere() {
            if (forumId !== 'news') return true;
            if (!username) return false;
            if (username === '20k') return true;
            try {
                const r = await fetch('/api/profile/' + encodeURIComponent(username));
                const d = await r.json();
                const t = (d.title || '').toLowerCase();
                return t === 'owner' || t === 'moderator' || t === 'mod' || t === 'janitor';
            } catch (e) { return false; }
        }

        async function setupCreateArea() {
            const area = document.getElementById('createArea');
            if (!username) {
                area.innerHTML = '<a href="/login" class="button" style="text-decoration:none;">Login to post</a>';
                return;
            }
            const allowed = await canPostHere();
            if (!allowed) {
                area.innerHTML = '<span style="color:#fffd01;font-size:0.9em;font-weight:bold;">Staff only board</span>';
                return;
            }
            area.innerHTML = '<button class="button" onclick="openCreateModal()">+ Create d1sc</button>';
        }

        function renderModalPreviews() {
            const container = document.getElementById('modalMediaPreviewList');
            if (!container) return;
            if (!uploadedUrls.length) {
                container.innerHTML = '';
                return;
            }
            container.innerHTML = uploadedUrls.map(function (url, idx) {
                const isVid = /\.(mp4|webm|mov)(\?|$)/i.test(url) || /\/video\//i.test(url);
                const mediaEl = isVid
                    ? '<video src="' + escapeHtml(url) + '" muted></video>'
                    : '<img src="' + escapeHtml(url) + '" alt="">';
                return '<div class="media-preview-item">' +
                    mediaEl +
                    '<button type="button" class="media-preview-remove" onclick="removeModalAttachment(' + idx + ')" title="Remove">X</button>' +
                '</div>';
            }).join('');
        }

        function removeModalAttachment(idx) {
            const removed = uploadedUrls.splice(idx, 1)[0];
            if (removed) {
                const box = document.getElementById('threadContent');
                box.value = box.value.replace(removed, '').replace(/\n{3,}/g, '\n\n').trim();
            }
            renderModalPreviews();
            document.getElementById('uploadStatus').textContent = uploadedUrls.length
                ? uploadedUrls.length + ' attachment(s) ready'
                : '';
        }

        function openCreateModal() {
            uploadedUrls = [];
            renderModalPreviews();
            document.getElementById('threadPrefix').value = '';
            document.getElementById('threadTitle').value = '';
            document.getElementById('threadContent').value = '';
            document.getElementById('threadFiles').value = '';
            document.getElementById('uploadStatus').textContent = '';
            document.getElementById('createModal').style.display = 'flex';
        }
        function closeCreateModal() {
            hideMentionDropdown();
            document.getElementById('createModal').style.display = 'none';
        }

        document.getElementById('threadFiles').addEventListener('change', async function () {
            const files = this.files;
            if (!files.length) return;
            const status = document.getElementById('uploadStatus');
            const contentBox = document.getElementById('threadContent');
            status.textContent = 'Uploading ' + files.length + ' file(s)...';
            for (let i = 0; i < files.length; i++) {
                const fd = new FormData();
                fd.append('file', files[i]);
                try {
                    const r = await fetch('/api/upload', { method: 'POST', body: fd });
                    const d = await r.json();
                    if (d.success && d.url) {
                        uploadedUrls.push(d.url);
                        contentBox.value = (contentBox.value ? contentBox.value + '\n\n' : '') + d.url;
                    }
                } catch (e) {}
            }
            renderModalPreviews();
            status.textContent = uploadedUrls.length
                ? uploadedUrls.length + ' attachment(s) ready'
                : 'Upload failed (check Cloudinary keys / terminal)';
        });

        async function createThread() {
            const title = document.getElementById('threadTitle').value.trim();
            const content = document.getElementById('threadContent').value.trim();
            const prefix = document.getElementById('threadPrefix').value;
            if (!title) return showNotification('Enter a title', '#d93838');
            if (!username) return showNotification('Login required', '#d93838');
            try {
                const res = await fetch('/api/threads', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: title, content: content, forum_id: forumId,
                        username: username, fileUrls: uploadedUrls, prefix: prefix
                    })
                });
                const data = await res.json();
                showNotification(data.message || (data.success ? 'Created!' : 'Failed'), data.success ? '#00cc66' : '#d93838');
                if (data.success) { closeCreateModal(); loadThreads(); }
            } catch (e) { showNotification('Server error', '#d93838'); }
        }

        function timeAgo(date) {
            if (!date) return '';
            const s = Math.floor((Date.now() - new Date(date)) / 1000);
            if (s < 60) return 'just now';
            const m = Math.floor(s / 60);
            if (m < 60) return m + 'm ago';
            const h = Math.floor(m / 60);
            if (h < 24) return h + 'h ago';
            const d = Math.floor(h / 24);
            return d + 'd ago';
        }

        function insertTag(boxId, openTag, closeTag) {
            const box = document.getElementById(boxId);
            if (!box) return;
            const start = box.selectionStart || 0;
            const end = box.selectionEnd || 0;
            const selected = box.value.slice(start, end);
            const replacement = openTag + selected + closeTag;
            box.value = box.value.slice(0, start) + replacement + box.value.slice(end);
            box.focus();
            const cursor = selected ? start + replacement.length : start + openTag.length;
            box.setSelectionRange(cursor, cursor);
        }

        function renderPrefixFilterBar() {
            const bar = document.getElementById('prefixFilterBar');
            if (!bar) return;
            const prefixes = [];
            allBoardThreads.forEach(function (t) {
                if (t.prefix && prefixes.indexOf(t.prefix) === -1) prefixes.push(t.prefix);
            });
            if (!prefixes.length) {
                bar.style.display = 'none';
                return;
            }
            let html = '<span style="font-size:0.82em;color:#c5d4eb;margin-right:4px;">Prefix:</span>';
            html += '<button type="button" class="filter-pill ' + (!activePrefixFilter ? 'active' : '') + '" onclick="setPrefixFilter(\'\')">All (' + allBoardThreads.length + ')</button>';
            prefixes.forEach(function (pf) {
                const jsPf = String(pf).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                html += '<button type="button" class="filter-pill ' + (activePrefixFilter === pf ? 'active' : '') + '" onclick="setPrefixFilter(\'' + jsPf + '\')">' + escapeHtml(pf) + '</button>';
            });
            bar.innerHTML = html;
            bar.style.display = 'flex';
        }

        function setPrefixFilter(pf) {
            activePrefixFilter = pf;
            renderPrefixFilterBar();
            renderThreadRows();
        }

        function renderThreadRows() {
            const filtered = activePrefixFilter
                ? allBoardThreads.filter(function (t) { return t.prefix === activePrefixFilter; })
                : allBoardThreads;
            if (!filtered.length) {
                document.getElementById('threadsList').innerHTML = '<div style="padding:14px 16px;color:#c5d4eb;">No discussions match this filter.</div>';
                return;
            }
            let html = '';
            filtered.forEach(function (t) {
                const canManage = username === '20k' || username === t.user_id;
                const safeTitle = String(t.title || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                const last = t.lastPost || { user: t.user_id, at: t.created_at, id: '' };
                const lastUrl = '/thread.html?id=' + encodeURIComponent(t.id) + '&title=' + encodeURIComponent(t.title || '') + (last.id ? '#post-' + encodeURIComponent(last.id) : '');
                const replies = Math.max(0, (t.postCount || 1) - 1);
                html += '<div class="thread ' + (t.pinned ? 'pinned' : '') + '" onclick="goThread(\'' + t.id + '\',\'' + safeTitle + '\')">';
                html += '<div class="thread-main"><div class="thread-title-line">' + prefixBadge(t.prefix) + escapeHtml(t.title || 'Untitled');
                if (t.pinned) html += '<span class="status-tag">Pinned</span>';
                if (t.locked) html += '<span class="status-tag" style="color:#ff8080;">Locked</span>';
                html += '</div><div class="thread-meta">Started by <a href="/profile.html?user=' + encodeURIComponent(t.user_id || '') + '" onclick="event.stopPropagation();">' + escapeHtml(t.user_id || 'Unknown') + '</a> · ' + escapeHtml(timeAgo(t.created_at)) + '</div></div>';
                html += '<div class="thread-stats-col">' +
                    '<div><strong>' + replies + '</strong>Replies</div>' +
                    '<div><strong>' + (t.views || 0) + '</strong>Views</div>' +
                '</div>';
                html += '<div class="thread-lastpost" onclick="event.stopPropagation();">' +
                    '<div><a href="' + lastUrl + '">Last post</a> by <a href="/profile.html?user=' + encodeURIComponent(last.user || '') + '">' + escapeHtml(last.user || 'Unknown') + '</a></div>' +
                    '<div>' + escapeHtml(timeAgo(last.at)) + '</div>' +
                '</div>';
                html += '<button class="menu-btn" onclick="event.stopPropagation();showDropdown(\'' + t.id + '\',event)">⋮</button>';
                html += '<div class="dropdown-menu" id="dropdown-' + t.id + '">';
                if (username === '20k') html += '<button onclick="event.stopPropagation();togglePin(\'' + t.id + '\')">' + (t.pinned ? 'Unpin' : 'Pin') + '</button>';
                if (canManage) html += '<button onclick="event.stopPropagation();openDeleteModal(\'' + t.id + '\')">Delete</button>';
                html += '<button onclick="event.stopPropagation();openReportModal(\'' + t.id + '\')">Report</button></div></div>';
            });
            document.getElementById('threadsList').innerHTML = html;
        }

        async function loadThreads() {
            try {
                const res = await fetch('/api/forums/' + encodeURIComponent(forumId) + '/threads');
                const threads = await res.json();
                if (!Array.isArray(threads)) {
                    document.getElementById('threadsList').innerHTML = '<div style="padding:14px 16px;">Failed to load discussions.</div>';
                    return;
                }
                allBoardThreads = threads;
                if (!threads.length) {
                    document.getElementById('prefixFilterBar').style.display = 'none';
                    document.getElementById('threadsList').innerHTML = '<div style="padding:14px 16px;color:#c5d4eb;">No discussions yet. Be the first to create a d1sc!</div>';
                    return;
                }
                renderPrefixFilterBar();
                renderThreadRows();
            } catch (err) {
                document.getElementById('threadsList').innerHTML = '<div style="padding:14px 16px;">Failed to load discussions.</div>';
            }
        }

        function goThread(id, title) {
            window.location.href = '/thread.html?id=' + encodeURIComponent(id) + '&title=' + encodeURIComponent(title || '');
        }
        function showDropdown(threadId, e) {
            e.stopPropagation();
            document.querySelectorAll('.dropdown-menu').forEach(function (m) { m.style.display = 'none'; });
            const el = document.getElementById('dropdown-' + threadId);
            if (el) el.style.display = 'block';
        }
        document.addEventListener('click', function () {
            document.querySelectorAll('.dropdown-menu').forEach(function (m) { m.style.display = 'none'; });
        });

        async function togglePin(threadId) {
            try {
                const res = await fetch('/api/threads/' + threadId + '/pin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username })
                });
                const data = await res.json();
                showNotification(data.message, data.success ? '#00cc66' : '#d93838');
                if (data.success) loadThreads();
            } catch (err) { showNotification('Pin failed', '#d93838'); }
        }

        function openDeleteModal(id) {
            pendingDeleteId = id;
            document.getElementById('deleteModal').style.display = 'flex';
        }
        function closeDeleteModal() {
            pendingDeleteId = null;
            document.getElementById('deleteModal').style.display = 'none';
        }
        async function confirmDelete() {
            if (!pendingDeleteId) return;
            const res = await fetch('/api/threads/' + pendingDeleteId, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username })
            });
            const data = await res.json();
            showNotification(data.message, data.success ? '#00cc66' : '#d93838');
            closeDeleteModal();
            if (data.success) loadThreads();
        }

        function openReportModal(id) {
            pendingReportId = id;
            document.getElementById('reportReason').value = '';
            document.getElementById('reportModal').style.display = 'flex';
        }
        function closeReportModal() {
            pendingReportId = null;
            document.getElementById('reportModal').style.display = 'none';
        }
        async function submitReport() {
            const reason = document.getElementById('reportReason').value.trim();
            if (!reason) return showNotification('Enter a reason', '#d93838');
            await fetch('/api/report', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ post_id: pendingReportId, reported_by: username, reason: reason })
            });
            closeReportModal();
            showNotification('Report submitted', '#00cc66');
        }

        async function checkBan() {
            const currentUser = localStorage.getItem('username');
            if (!currentUser) return;
            try {
                const res = await fetch('/api/check-ban/' + encodeURIComponent(currentUser));
                const data = await res.json();
                if (data.banned) {
                    localStorage.clear();
                    window.location.href = '/banned.html?reason=' + encodeURIComponent(data.reason || 'No reason') + '&type=' + (data.type || 'permanent');
                }
            } catch (e) {}
        }

        async function loadGlobalBanner() {
            try {
                const res = await fetch('/api/global-banner');
                const data = await res.json();
                const el = document.getElementById('global-banner');
                if (!el) return;
                if (data && data.active && (data.text || data.imageUrl)) {
                    let content = escapeHtml(data.text || '');
                    if (data.imageUrl) content += '<br><img src="' + escapeHtml(data.imageUrl) + '" style="max-width:100%;margin-top:8px;">';
                    el.innerHTML = content;
                    el.style.display = 'block';
                } else el.style.display = 'none';
            } catch (e) {}
        }

        async function loadAlertBadge() {
            if (!username) return;
            try {
                const res = await fetch('/api/alerts/' + encodeURIComponent(username));
                if (!res.ok) return;
                const data = await res.json();
                const badge = document.getElementById('alert-badge');
                if (!badge) return;
                if (data.unread > 0) {
                    badge.style.display = 'inline';
                    badge.textContent = data.unread > 99 ? '99+' : data.unread;
                } else badge.style.display = 'none';
            } catch (e) {}
        }

        setupCreateArea();
        loadThreads();
        loadGlobalBanner();
        checkBan();
        loadAlertBadge();
        setInterval(checkBan, 8000);
        setInterval(loadAlertBadge, 15000);
    </script>
</body>
</html>

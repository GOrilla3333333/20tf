<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - 20Thousand Forums</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="https://i.imgur.com/oJCfWc8.png">
    <style>
        .form-container {
            max-width: 400px;
            margin: 60px auto;
            background: #1e2f4f;
            padding: 36px 32px;
            border-radius: 12px;
            border: 2px solid #0165fc;
            box-shadow: 0 8px 26px rgba(0, 0, 0, 0.35);
            text-align: center;
        }
        .form-container input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            margin-bottom: 14px;
            border-radius: 8px;
            border: 2px solid #0165fc;
            background: #0f1b2e;
            color: #ffffff;
            font-family: inherit;
            font-size: 1em;
            outline: none;
        }
        .form-container input:focus {
            border-color: #fffd01;
        }
        .form-container a {
            color: #fffd01;
            text-decoration: none;
            font-weight: bold;
        }
        .form-container a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <img src="https://i.imgur.com/oJCfWc8.png" class="logo" alt="Logo" onclick="window.location.href='/'">
        <h1>20Thousand Forums</h1>
    </header>

    <nav>
        <a href="/">Home</a>
        <a href="/forums">Boards</a>
        <a href="/login">Login</a>
        <a href="/register" class="active">Register</a>
    </nav>

    <div class="form-container">
        <h1 style="margin-bottom:20px;">Register</h1>
        <form id="registerForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="button" style="width:100%;padding:12px;">Create Account</button>
        </form>
        <p id="message" style="font-weight:bold;"></p>
        <p style="margin-top:18px;color:#9fb3c8;">Already have an account? <a href="/login">Login</a></p>
    </div>

    <script>
        function showMessage(text, success) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.style.color = success ? '#00ff88' : '#ff6666';
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                showMessage(data.message, data.success);

                if (data.success) {
                    setTimeout(() => window.location.href = '/login', 1500);
                }
            } catch (err) {
                showMessage("Cannot connect to server", false);
            }
        });
    </script>
</body>
</html>

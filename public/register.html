<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - 20Thousand Forums</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="https://i.imgur.com/oJCfWc8.png">
    <style>
        .auth-wrap {
            max-width: 520px;
            margin: 32px auto;
        }
        .form-row {
            display: grid;
            grid-template-columns: 140px 1fr;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid #293247;
        }
        .form-row label {
            color: #cbd5e1;
            font-size: 13px;
            text-align: right;
            font-weight: 500;
        }
        .form-row input {
            width: 100%;
        }
        .form-submit-row {
            padding: 12px 16px;
            background: #1b2130;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        @media (max-width: 520px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 6px;
            }
            .form-row label {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <img src="https://i.imgur.com/oJCfWc8.png" class="logo" alt="Logo" onclick="window.location.href='/'">
            <h1 onclick="window.location.href='/'">20Thousand Forums</h1>
        </div>
    </header>

    <nav>
        <a href="/">Home</a>
        <a href="/forums">Boards</a>
        <a href="/login">Login</a>
        <a href="/register" class="active">Register</a>
    </nav>

    <div class="container">
        <div class="auth-wrap">
            <div class="breadcrumbs">
                <a href="/">Home</a>
                <span class="bc-sep">›</span>
                <span class="bc-current">Register</span>
            </div>

            <div class="xf-block">
                <div class="xf-block-header">Register</div>
                <form id="registerForm">
                    <div class="form-row">
                        <label for="username">Username:</label>
                        <input type="text" id="username" required autofocus>
                    </div>
                    <div class="form-row">
                        <label for="password">Password:</label>
                        <input type="password" id="password" required>
                    </div>
                    <div id="message" style="padding:0 16px;font-weight:600;font-size:12.5px;"></div>
                    <div class="form-submit-row">
                        <span style="font-size:12.5px;color:#8c98b3;">Already have an account? <a href="/login">Log in</a></span>
                        <button type="submit" class="button">Register</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="site-footer-inner">
            <span>20Thousand Forums</span>
            <div>
                <a href="/">Home</a>
                <a href="/forums">Boards</a>
                <a href="/tos">Terms &amp; Rules</a>
            </div>
        </div>
    </footer>

    <script>
        function showMessage(text, success) {
            const msg = document.getElementById('message');
            msg.style.padding = '10px 16px';
            msg.textContent = text;
            msg.style.color = success ? '#34d399' : '#f87171';
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                showMessage(data.message, data.success);

                if (data.success) {
                    setTimeout(() => window.location.href = '/login', 1200);
                }
            } catch (err) {
                showMessage("Cannot connect to server", false);
            }
        });
    </script>
</body>
</html>

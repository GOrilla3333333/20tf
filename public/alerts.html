<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts - 20Thousand Forums</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="https://i.imgur.com/oJCfWc8.png">
    <style>
        .alert-item {
            background: #202738;
            border-bottom: 1px solid #293247;
            padding: 11px 16px;
        }
        .alert-item:last-child {
            border-bottom: none;
        }
        .alert-item.unread {
            background: #252e42;
        }
        .alert-item a {
            color: #55a6f8;
            text-decoration: none;
            font-weight: 600;
        }
        .alert-item a:hover { text-decoration: underline; }
        .meta { color: #8c98b3; font-size: 11.5px; margin-top: 4px; }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <img src="https://i.imgur.com/oJCfWc8.png" class="logo" alt="Logo" onclick="window.location.href='/'">
            <h1 onclick="window.location.href='/'">20Thousand Forums</h1>
        </div>
    </header>

    <nav>
        <a href="/">Home</a>
        <a href="/forums">Boards</a>
        <a href="/members.html">Members</a>
        <a href="/watched.html">Watched</a>
        <a href="/bookmarks.html">Bookmarks</a>
        <a href="/search.html">Search</a>
        <a href="/inbox.html">Inbox <span id="inbox-badge" class="nav-badge" style="display:none;">0</span></a>
        <a href="/alerts.html" class="active">Alerts</a>
        <span id="user-nav"></span>
        <form action="/search.html" method="get" class="nav-search">
            <input name="q" placeholder="Search...">
            <button type="submit">Search</button>
        </form>
    </nav>

    <div class="container" style="max-width:860px;">
        <div class="breadcrumbs">
            <a href="/">Home</a>
            <span class="bc-sep">›</span>
            <span class="bc-current">Alerts</span>
        </div>

        <div class="p-body-header">
            <h2 class="p-title-value">Alerts</h2>
            <button class="button-secondary" onclick="markAllRead()">Mark all read</button>
        </div>

        <div class="xf-block" id="list">
            <div style="padding:14px 16px;color:#8c98b3;">Loading...</div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="site-footer-inner">
            <span>20Thousand Forums</span>
            <div>
                <a href="/">Home</a>
                <a href="/forums">Boards</a>
                <a href="/tos">Terms &amp; Rules</a>
            </div>
        </div>
    </footer>

    <script>
        const username = localStorage.getItem('username');
        if (!username) window.location.href = '/login';

        function escapeHtml(s) {
            return String(s || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        document.getElementById('user-nav').innerHTML =
            `<span class="nav-user-bar">Signed in as <a href="/profile.html?user=${encodeURIComponent(username)}"><strong>${escapeHtml(username)}</strong></a></span>`;

        function renderAlertText(a) {
            const from = a.from_user
                ? `<a href="/profile.html?user=${encodeURIComponent(a.from_user)}">${escapeHtml(a.from_user)}</a>`
                : "Someone";
            const link = escapeHtml(a.link || "/");
            const title = escapeHtml(a.threadTitle || "");

            if (a.type === "watched_reply") {
                return `${from} replied to your watched thread <a href="${link}">${title || 'View thread'}</a>.`;
            }
            if (a.type === "thread_reply" || a.type === "reply") {
                if (title) {
                    return `${from} replied to the thread <a href="${link}">${title}</a>.`;
                }
                return `${from} replied to your message (<a href="${link}">view</a>).`;
            }
            if (a.type === "private_message") {
                return `<a href="${link}">${escapeHtml(a.message || 'New private message')}</a>`;
            }
            if (a.type === "warning") {
                return `<span style="color:#f59e0b;font-weight:600;">Moderation Notice:</span> <a href="${link}">${escapeHtml(a.message || 'You received a warning')}</a>`;
            }
            if (a.type === "profile_comment") {
                return `${from} left a message on your <a href="${link}">profile</a>.`;
            }
            if (a.type === "reaction") {
                return `${from} reacted to your post in the thread <a href="${link}">${title || 'd1sc'}</a>.`;
            }
            return `${from}: <a href="${link}">${escapeHtml(a.message || "view")}</a>`;
        }

        async function loadAlerts() {
            try {
                const res = await fetch(`/api/alerts/${encodeURIComponent(username)}`);
                const data = await res.json();
                const inboxBadge = document.getElementById('inbox-badge');
                if (inboxBadge) {
                    if (data.unreadInbox > 0) {
                        inboxBadge.style.display = 'inline';
                        inboxBadge.textContent = data.unreadInbox > 99 ? '99+' : data.unreadInbox;
                    } else inboxBadge.style.display = 'none';
                }
                const list = document.getElementById('list');

                if (!data.alerts || !data.alerts.length) {
                    list.innerHTML = "<div style='padding:14px 16px;color:#8c98b3;'>You do not have any recent alerts.</div>";
                    return;
                }

                list.innerHTML = data.alerts.map(a => `
                    <div class="alert-item ${a.read ? '' : 'unread'}">
                        <div>${renderAlertText(a)}</div>
                        <div class="meta">
                            ${new Date(a.created_at).toLocaleString()}${a.read ? '' : ' · <strong style="color:#eceff4;">Unread</strong>'}
                            · <a href="#" onclick="event.preventDefault(); markOne('${escapeHtml(a.id)}')">Mark read</a>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById('list').innerHTML = "<div style='padding:14px 16px;color:#8c98b3;'>Failed to load alerts.</div>";
            }
        }

        async function markOne(id) {
            await fetch(`/api/alerts/${encodeURIComponent(id)}/read`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username })
            });
            loadAlerts();
        }

        async function markAllRead() {
            await fetch('/api/alerts/read-all', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username })
            });
            loadAlerts();
        }

        loadAlerts();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts - 20Thousand Forums</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="https://i.imgur.com/oJCfWc8.png">
    <style>
        .alerts-block {
            background: #1e2f4f;
            border: 1px solid #2b4570;
            border-radius: 4px;
            overflow: hidden;
        }
        .alert-item {
            background: #1e2f4f;
            border-bottom: 1px solid #283e64;
            padding: 13px 16px;
        }
        .alert-item:last-child {
            border-bottom: none;
        }
        .alert-item.unread {
            background: #253b61;
        }
        .alert-item a {
            color: #fffd01;
            text-decoration: none;
            font-weight: bold;
        }
        .alert-item a:hover { text-decoration: underline; }
        .meta { color: #c5d4eb; font-size: 0.86em; margin-top: 5px; }
        .top-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 12px 0;
        }
    </style>
</head>
<body>
    <header>
        <img src="https://i.imgur.com/oJCfWc8.png" class="logo" alt="Logo" onclick="window.location.href='/'">
        <h1>20Thousand Forums</h1>
    </header>

    <nav>
        <a href="/">Home</a>
        <a href="/forums">Boards</a>
        <a href="/search.html">Search</a>
        <a href="/alerts.html" class="active">Alerts</a>
        <span id="user-nav"></span>
        <form action="/search.html" method="get" class="nav-search">
            <input name="q" placeholder="Search users or d1scs...">
            <button type="submit">Search</button>
        </form>
    </nav>

    <div class="container" style="max-width:780px;">
        <div class="breadcrumbs">
            <a href="/">Home</a>
            <span class="bc-sep">›</span>
            <span class="bc-current">Alerts</span>
        </div>

        <div class="top-actions">
            <h2 style="margin:0;color:#fffd01;">Alerts</h2>
            <button class="button" onclick="markAllRead()">Mark all read</button>
        </div>
        <div class="alerts-block" id="list">
            <div style="padding:14px 16px;color:#c5d4eb;">Loading...</div>
        </div>
    </div>

    <script>
        const username = localStorage.getItem('username');
        if (!username) window.location.href = '/login';

        function escapeHtml(s) {
            return String(s || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        document.getElementById('user-nav').innerHTML =
            `<span class="nav-user-bar">Signed in as <a href="/profile.html?user=${encodeURIComponent(username)}"><strong>${escapeHtml(username)}</strong></a></span>`;

        function renderAlertText(a) {
            const from = a.from_user
                ? `<a href="/profile.html?user=${encodeURIComponent(a.from_user)}">${escapeHtml(a.from_user)}</a>`
                : "Someone";
            const link = escapeHtml(a.link || "/");
            const title = escapeHtml(a.threadTitle || "");

            if (a.type === "thread_reply" || a.type === "reply") {
                if (title) {
                    return `${from} replied in <a href="${link}">"${title}"</a>`;
                }
                return `${from} replied to your post (<a href="${link}">view</a>)`;
            }
            if (a.type === "profile_comment") {
                return `${from} commented on your <a href="${link}">profile</a>`;
            }
            if (a.type === "reaction") {
                return `${from} reacted to your post in <a href="${link}">"${title || 'd1sc'}"</a>`;
            }
            return `${from}: <a href="${link}">${escapeHtml(a.message || "view")}</a>`;
        }

        async function loadAlerts() {
            try {
                const res = await fetch(`/api/alerts/${encodeURIComponent(username)}`);
                const data = await res.json();
                const list = document.getElementById('list');

                if (!data.alerts || !data.alerts.length) {
                    list.innerHTML = "<div style='padding:14px 16px;color:#c5d4eb;'>No alerts yet.</div>";
                    return;
                }

                list.innerHTML = data.alerts.map(a => `
                    <div class="alert-item ${a.read ? '' : 'unread'}">
                        <div>${renderAlertText(a)}</div>
                        <div class="meta">
                            ${new Date(a.created_at).toLocaleString()}${a.read ? '' : ' · <strong style="color:#fffd01;">Unread</strong>'}
                            · <a href="#" onclick="event.preventDefault(); markOne('${escapeHtml(a.id)}')">Mark read</a>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById('list').innerHTML = "<div style='padding:14px 16px;'>Failed to load alerts.</div>";
            }
        }

        async function markOne(id) {
            await fetch(`/api/alerts/${encodeURIComponent(id)}/read`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username })
            });
            loadAlerts();
        }

        async function markAllRead() {
            await fetch('/api/alerts/read-all', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username })
            });
            loadAlerts();
        }

        loadAlerts();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watched Threads - 20Thousand Forums</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="https://i.imgur.com/oJCfWc8.png">
    <style>
        .watched-row {
            display: grid;
            grid-template-columns: 44px minmax(0, 1fr) 115px 180px 90px;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-bottom: 1px solid #293247;
            background: #202738;
        }
        .watched-row:last-child {
            border-bottom: none;
        }
        .watched-row:hover {
            background: #242c3f;
        }
        .watched-title {
            color: #eceff4;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
        }
        .watched-title:hover {
            color: #55a6f8;
            text-decoration: underline;
        }
        .watched-minor {
            font-size: 12px;
            color: #8c98b3;
            margin-top: 2px;
        }
        @media (max-width: 760px) {
            .watched-row {
                grid-template-columns: 40px minmax(0, 1fr);
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <img src="https://i.imgur.com/oJCfWc8.png" class="logo" alt="Logo" onclick="window.location.href='/'">
            <h1 onclick="window.location.href='/'">20Thousand Forums</h1>
        </div>
    </header>

    <nav>
        <a href="/">Home</a>
        <a href="/forums">Boards</a>
        <a href="/members.html">Members</a>
        <a href="/watched.html" class="active">Watched</a>
        <a href="/bookmarks.html">Bookmarks</a>
        <a href="/search.html">Search</a>
        <a href="/inbox.html">Inbox <span id="inbox-badge" class="nav-badge" style="display:none;">0</span></a>
        <a href="/alerts.html">Alerts <span id="alert-badge" class="nav-badge" style="display:none;">0</span></a>
        <span id="user-nav"></span>
        <form action="/search.html" method="get" class="nav-search">
            <input name="q" placeholder="Search...">
            <button type="submit">Search</button>
        </form>
    </nav>

    <div class="container">
        <div class="breadcrumbs">
            <a href="/">Home</a>
            <span class="bc-sep">›</span>
            <span class="bc-current">Watched Threads</span>
        </div>

        <div class="p-body-header">
            <div>
                <h2 class="p-title-value">Watched Threads</h2>
                <p class="p-description">Threads you are subscribed to. You will receive an alert when someone replies.</p>
            </div>
        </div>

        <div class="xf-block" id="watchedList">
            <div style="padding:18px;color:#8c98b3;">Loading watched threads...</div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="site-footer-inner">
            <span>20Thousand Forums</span>
            <div>
                <a href="/">Home</a>
                <a href="/forums">Boards</a>
                <a href="/tos">Terms &amp; Rules</a>
            </div>
        </div>
    </footer>

    <script>
        const username = localStorage.getItem('username');
        if (!username) {
            window.location.href = '/login';
        }

        const PREFIX_COLORS = {
            "News": "#16a34a", "Serious": "#2563eb", "Discussion": "#7c3aed",
            "Question": "#0d9488", "Vent": "#6d28d9", "Media": "#d97706",
            "Art": "#db2777", "Tech": "#0284c7", "Brainrot": "#ea580c",
            "NSFW": "#dc2626", "Story": "#059669", "Help": "#ca8a04",
            "Announcement": "#e11d48"
        };

        const BOARD_NAMES = {
            "news": "News & Announcements",
            "rules": "Rules & Site Info",
            "b": "General / Random",
            "serious": "Serious Discussion",
            "vent": "Venting / Off My Chest",
            "int": "International",
            "brainrot": "Brainrot / Memes",
            "art": "Art & OCs",
            "media": "Music, Vidya & Media",
            "tech": "Tech & Coding",
            "nsfw": "18+ / NSFW",
            "stories": "Greentexts & Stories",
            "qna": "Questions & Advice"
        };

        function escapeHtml(s) {
            return String(s || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function prefixBadge(prefix) {
            if (!prefix) return '';
            const color = PREFIX_COLORS[prefix] || '#2563eb';
            return `<span class="prefix-badge" style="background:${color};">${escapeHtml(prefix)}</span>`;
        }

        document.getElementById('user-nav').innerHTML = username
            ? `<span class="nav-user-bar">Signed in as <a href="/profile.html?user=${encodeURIComponent(username)}"><strong>${escapeHtml(username)}</strong></a>${username === '20k' ? ' · <a href="/admin.html">Admin</a>' : ''} · <a href="#" onclick="showLogoutModal();return false;">Logout</a></span>`
            : '<a href="/login">Login</a> <a href="/register">Register</a>';

        function showLogoutModal() {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.style.display = 'flex';
            modal.innerHTML = `<div class="modal-content" style="text-align:center;"><h3>Logout?</h3><p>Are you sure you want to logout?</p><button class="button" style="background:#dc2626;border-color:#dc2626;" onclick="localStorage.removeItem('username');location.href='/'">Yes, Logout</button> <button class="button-secondary" onclick="this.parentElement.parentElement.remove()">Cancel</button></div>`;
            document.body.appendChild(modal);
        }

        function showNotification(text, color) {
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.style.background = color;
            notif.textContent = text;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 2800);
        }

        async function loadWatched() {
            const listEl = document.getElementById('watchedList');
            try {
                const res = await fetch(`/api/watched?username=${encodeURIComponent(username)}`);
                const items = await res.json();
                if (!Array.isArray(items) || !items.length) {
                    listEl.innerHTML = '<div style="padding:18px;color:#8c98b3;">You are not watching any threads yet. Click the "Watch" button at the top of any thread to subscribe.</div>';
                    return;
                }
                listEl.innerHTML = items.map(t => {
                    const jsId = String(t.id || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                    const boardLabel = BOARD_NAMES[t.forum_id] || ('s1k/' + t.forum_id + '/');
                    return `
                        <div class="watched-row">
                            <div>
                                <a href="/profile.html?user=${encodeURIComponent(t.user_id)}">
                                    <img class="avatar-sq" src="${escapeHtml(t.creatorPfp || 'https://i.imgur.com/oJCfWc8.png')}" alt="">
                                </a>
                            </div>
                            <div>
                                ${prefixBadge(t.prefix)}<a class="watched-title" href="/thread.html?id=${encodeURIComponent(t.id)}">${escapeHtml(t.title)}</a>
                                <div class="watched-minor">
                                    Started by <a href="/profile.html?user=${encodeURIComponent(t.user_id)}">${escapeHtml(t.user_id)}</a> ·
                                    <a href="/thread-list.html?id=${encodeURIComponent(t.forum_id)}">${escapeHtml(boardLabel)}</a>
                                </div>
                            </div>
                            <div style="font-size:12px;color:#8c98b3;">
                                <dl class="pairs-justified"><dt>Replies:</dt><dd>${t.repliesCount || 0}</dd></dl>
                                <dl class="pairs-justified"><dt>Views:</dt><dd>${t.views || 0}</dd></dl>
                            </div>
                            <div style="font-size:12px;color:#8c98b3;text-align:right;">
                                <div style="color:#dce2ec;">${t.lastPost && t.lastPost.at ? new Date(t.lastPost.at).toLocaleDateString() : ''}</div>
                                <div>Last by <strong>${escapeHtml((t.lastPost && t.lastPost.user) || t.user_id)}</strong></div>
                            </div>
                            <div style="text-align:right;">
                                <button type="button" class="button-secondary" style="padding:4px 9px;font-size:11.5px;" onclick="unwatchThread('${jsId}')">Unwatch</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                listEl.innerHTML = '<div style="padding:18px;color:#8c98b3;">Failed to load watched threads.</div>';
            }
        }

        async function unwatchThread(threadId) {
            try {
                const res = await fetch(`/api/threads/${encodeURIComponent(threadId)}/watch`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                const data = await res.json();
                if (data.success) {
                    showNotification(data.message, '#16a34a');
                    loadWatched();
                }
            } catch (e) {}
        }

        async function loadAlertBadge() {
            if (!username) return;
            try {
                const res = await fetch(`/api/alerts/${encodeURIComponent(username)}`);
                if (!res.ok) return;
                const data = await res.json();
                const badge = document.getElementById('alert-badge');
                if (badge) {
                    if (data.unread > 0) {
                        badge.style.display = 'inline';
                        badge.textContent = data.unread > 99 ? '99+' : data.unread;
                    } else badge.style.display = 'none';
                }
                const inboxBadge = document.getElementById('inbox-badge');
                if (inboxBadge) {
                    if (data.unreadInbox > 0) {
                        inboxBadge.style.display = 'inline';
                        inboxBadge.textContent = data.unreadInbox > 99 ? '99+' : data.unreadInbox;
                    } else inboxBadge.style.display = 'none';
                }
            } catch (e) {}
        }

        loadWatched();
        loadAlertBadge();
        setInterval(loadAlertBadge, 15000);
    </script>
</body>
</html>
